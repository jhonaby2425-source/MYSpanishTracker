                      </span>
                    ) : (q.isRoutine && q.scheduledDay) ? (
                      <span className="qt-routine-next-date" title={`Computed from its ${q.scheduledDay} weekly schedule, not a fixed deadline`}>
                        {formatShortDate(getNextRoutineDate(q.scheduledDay, todayISO))}
                        <span className="qt-routine-next-tag">next</span>
                      </span>
                    ) : "—"}
                  </td>
                )}
                {visibleColumns.routine && (
                  <td data-label="Routine">
                    <button
                      className={`qt-routine-pill ${q.isRoutine ? "active" : ""}`}
                      onClick={() => onToggleRoutine(q.id)}
                      aria-pressed={q.isRoutine}
                      aria-label={q.isRoutine ? `Remove "${q.name}" from routine schedule` : `Add "${q.name}" to routine schedule`}
                    ><Icon name="repeat" size={11}/> {q.isRoutine ? q.scheduledDay || "Routine" : "One-off"}</button>
                  </td>
                )}
                {visibleColumns.score && (
                  <td data-label="Score">
                    <ScoreCell quiz={q} subject={subj} settings={settings} onUpdateCorrectItems={onUpdateCorrectItems} onUpdatePercentScore={onUpdatePercentScore} />
                  </td>
                )}
                {visibleColumns.status && <td data-label="Status"><StatusPill status={status} /></td>}
                <td><div className="qt-row-actions">
                  <button className="qt-icon-btn" onClick={() => onEdit(q)} aria-label={`Edit "${q.name}"`}><Icon name="edit" size={13}/></button>
                  <button className="qt-icon-btn" onClick={() => onDuplicate(q.id)} aria-label={`Duplicate "${q.name}"`} title="Duplicate"><Icon name="copy" size={13}/></button>
                  <button className="qt-icon-btn danger" onClick={() => onDelete(q.id)} aria-label={`Delete "${q.name}"`}><Icon name="trash" size={13}/></button>
                </div></td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

function HistoryScoreCell({ entry, subject, settings }) {
  const percent = getEntryPercent(entry);
  if (percent === null) return <span className="qt-mono qt-muted">—</span>;
  const threshold = getThreshold(subject, settings);
  return <span className={percent >= threshold ? "qt-preview-pass" : "qt-preview-fail"}>{percent}% {percent >= threshold ? "· Pass" : "· Fail"}</span>;
}

/* Archive of completed work. Routine quizzes reset every ISO week (see
   performWeeklyRollover in App), so their past completions live here instead
   of disappearing. One-off quizzes never reset, so their current completed
   state is shown here too — a permanent, chronological completion log
   separate from the working table. */
function HistoryView({ historyLog, quizzes, subjectMap, settings }) {
  // See getCombinedHistory's own doc comment for why current-week routine
  // completions have to be merged in here rather than read from historyLog
  // alone.
  const combined = useMemo(() => getCombinedHistory(quizzes, historyLog), [quizzes, historyLog]);

  if (combined.length === 0) {
    return <div className="qt-empty">Nothing completed yet. Check off a quiz and it'll show up here — routine quizzes stay listed as "this week" until the week rolls over, then archive permanently.</div>;
  }

  return (
    <div className="qt-table-wrap">
      <table className="qt-table">
        <thead><tr>
          <th>Quiz</th><th>Subject</th><th>Type</th><th>Week</th><th>Completed on</th><th>Score</th><th style={{ width: 40 }}></th>
        </tr></thead>
        <tbody>
          {combined.map((h) => {
            const subj = subjectMap[h.subjectId] || { name: "Unassigned", icon: "•", color: "#999", soft: "#eee" };
            return (
              <tr key={h.id}>
                <td data-label="Quiz"><span className="qt-name">{h.quizName}</span></td>
                <td data-label="Subject"><span className="qt-subject-pill" style={{ background: subj.soft, color: subj.color, borderColor: subj.color }}>{subj.icon} {subj.name}</span></td>
                <td data-label="Type">{h.isOneOff ? "One-off" : (
                  <span className="qt-routine-pill active">
                    <Icon name="repeat" size={11}/> Routine{h.isCurrent && <span className="qt-current-week-tag">this week</span>}
                  </span>
                )}</td>
                <td data-label="Week" className="qt-mono">{h.week || "—"}</td>
                <td data-label="Completed on" className="qt-mono">{h.date || "—"}</td>
                <td data-label="Score"><HistoryScoreCell entry={h} subject={subj} settings={settings} /></td>
                <td>{h.link ? (
                  <a className="qt-icon-btn" href={h.link} target="_blank" rel="noreferrer" aria-label={`Open link for ${h.quizName}`}><Icon name="link" size={13}/></a>
                ) : null}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

/* ================= Charts / progress analytics ================= */

function ChartEmptyState({ children }) {
  return <div className="qt-empty">{children}</div>;
}

function ChartCard({ title, subtitle, full, children }) {
  return (
    <div className={`qt-chart-card ${full ? "qt-chart-card-full" : ""}`}>
      <div className="qt-chart-card-head">
        <h3 className="qt-chart-card-title">{title}</h3>
        {subtitle && <p className="qt-chart-card-subtitle">{subtitle}</p>}
      </div>
      {children}
    </div>
  );
}

/* Horizontal CSS bar chart of average score per subject. Each track marks
   that subject's own pass threshold as a tick (thresholds can be overridden
   per-subject — see passThreshold on the Subject model), so a bar can visibly
   clear or miss its own bar rather than a single global line. */
function SubjectScoreBarChart({ subjects, subjectStats, settings, highlightSubjectId }) {
  const rows = subjects
    .map((s) => ({ subject: s, stats: subjectStats[s.id] }))
    .filter((r) => r.stats && r.stats.attempts > 0 && r.stats.avgScore !== null);

  if (rows.length === 0) {
    return <ChartEmptyState>Grade a few completed quizzes to see average scores per subject here.</ChartEmptyState>;
  }

  return (
    <div className="qt-bar-chart" role="group" aria-label="Average score by subject">
      {rows.map(({ subject, stats }) => {
        const avg = Math.round(stats.avgScore * 10) / 10;
        const threshold = getThreshold(subject, settings);
        const dimmed = highlightSubjectId && highlightSubjectId !== "all" && highlightSubjectId !== subject.id;
        return (
          <div className={`qt-bar-row ${dimmed ? "is-dimmed" : ""}`} key={subject.id}>
            <div className="qt-bar-row-label">
              <span className="qt-bar-row-icon" style={{ color: subject.color }}>{subject.icon}</span>
              <span className="qt-bar-row-name">{subject.name}</span>
            </div>
            <div
              className="qt-bar-track"
              role="img"
              aria-label={`${subject.name}: average score ${avg}%, pass threshold ${threshold}%, from ${stats.attempts} graded attempt${stats.attempts === 1 ? "" : "s"}`}
            >
              <div className="qt-bar-threshold-tick" style={{ left: `${Math.min(100, Math.max(0, threshold))}%` }} title={`Pass threshold ${threshold}%`} />
              <div className="qt-bar-fill" style={{ width: `${Math.min(100, Math.max(0, avg))}%`, background: subject.color }} />
            </div>
            <div className="qt-bar-row-value qt-mono">
              {avg}%
              <span className="qt-bar-row-meta">{Math.round(stats.passRate * 100)}% pass · {stats.attempts} attempt{stats.attempts === 1 ? "" : "s"}</span>
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* Horizontal CSS bar chart: quizzes completed vs total logged, per subject. */
function CompletionBarChart({ completionBySubject, highlightSubjectId }) {
  const rows = completionBySubject.filter((r) => r.total > 0);
  if (rows.length === 0) {
    return <ChartEmptyState>Add quizzes to a subject to track completion here.</ChartEmptyState>;
  }
  return (
    <div className="qt-bar-chart" role="group" aria-label="Completion by subject">
      {rows.map(({ subject, total, completed }) => {
        const pct = total ? Math.round((completed / total) * 100) : 0;
        const dimmed = highlightSubjectId && highlightSubjectId !== "all" && highlightSubjectId !== subject.id;
        return (
          <div className={`qt-bar-row ${dimmed ? "is-dimmed" : ""}`} key={subject.id}>
            <div className="qt-bar-row-label">
              <span className="qt-bar-row-icon" style={{ color: subject.color }}>{subject.icon}</span>
              <span className="qt-bar-row-name">{subject.name}</span>
            </div>
            <div className="qt-bar-track" role="img" aria-label={`${subject.name}: ${completed} of ${total} quizzes completed, ${pct}%`}>
              <div className="qt-bar-fill" style={{ width: `${pct}%`, background: subject.color }} />
            </div>
            <div className="qt-bar-row-value qt-mono">{completed}/{total}</div>
          </div>
        );
      })}
    </div>
  );
}

/* SVG line chart of weekly average graded score over time, with a dashed
   pass-threshold reference line. Renders a single labeled point when there's
   only one week of data, and an empty state with none at all. The SVG is
   decorative (role="img" with a headline aria-label summary); a visually-
   hidden table right below it mirrors every point for screen-reader users
   who need the exact per-week values, not just the trend summary. */
function ScoreTrendChart({ points, threshold, accentColor }) {
  if (points.length === 0) {
    return <ChartEmptyState>Grade a few completed quizzes across different weeks to see a trend line here.</ChartEmptyState>;
  }
  const width = 640, height = 220;
  const padding = { top: 18, right: 18, bottom: 30, left: 34 };
  const innerW = width - padding.left - padding.right;
  const innerH = height - padding.top - padding.bottom;
  const n = points.length;
  const xFor = (i) => (n === 1 ? padding.left + innerW / 2 : padding.left + (innerW * i) / (n - 1));
  const yFor = (v) => padding.top + innerH - (Math.max(0, Math.min(100, v)) / 100) * innerH;
  const pathD = points.map((p, i) => `${i === 0 ? "M" : "L"} ${xFor(i).toFixed(1)} ${yFor(p.avg).toFixed(1)}`).join(" ");
  const first = points[0], last = points[points.length - 1];
  const trendWord = points.length > 1 ? (last.avg > first.avg ? "trending up" : last.avg < first.avg ? "trending down" : "holding steady") : "a single week so far";
  const summary = points.length > 1
    ? `Score trend across ${n} weeks: ${first.avg}% to ${last.avg}%, ${trendWord}.`
    : `Score trend: ${trendWord}, averaging ${first.avg}% for week ${first.weekKey}.`;
  // Thin out x-axis week labels on wide ranges so they don't overlap.
  const labelStep = Math.max(1, Math.ceil(n / 7));

  return (
    <div className="qt-trend-chart">
      <svg className="qt-trend-svg" viewBox={`0 0 ${width} ${height}`} role="img" aria-label={summary} preserveAspectRatio="xMidYMid meet">
        <title>{summary}</title>
        {[0, 25, 50, 75, 100].map((g) => (
          <g key={g}>
            <line x1={padding.left} x2={width - padding.right} y1={yFor(g)} y2={yFor(g)} stroke="var(--line)" strokeWidth="1" />
            <text x={padding.left - 8} y={yFor(g) + 3} textAnchor="end" fontSize="9" fontFamily="IBM Plex Mono, monospace" fill="var(--ink-soft)">{g}</text>
          </g>
        ))}
        {typeof threshold === "number" && (
          <line x1={padding.left} x2={width - padding.right} y1={yFor(threshold)} y2={yFor(threshold)} stroke="var(--gold)" strokeWidth="1.5" strokeDasharray="4 4" />
        )}
        {n > 1 && <path d={pathD} fill="none" stroke={accentColor || "var(--teal)"} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />}
        {points.map((p, i) => (
          <circle key={p.weekKey} cx={xFor(i)} cy={yFor(p.avg)} r={n === 1 ? 5 : 3.5} fill={accentColor || "var(--teal)"} stroke="var(--paper-raised)" strokeWidth="1.5">
            <title>{`${p.weekKey}: ${p.avg}% average (${p.count} graded)`}</title>
          </circle>
        ))}
        {points.map((p, i) => (i % labelStep === 0 || i === n - 1) && (
          <text key={`lbl-${p.weekKey}`} x={xFor(i)} y={height - 8} textAnchor="middle" fontSize="9" fontFamily="IBM Plex Mono, monospace" fill="var(--ink-soft)">
            {p.weekKey.replace(/^\d{4}-W/, "W")}
          </text>
        ))}
      </svg>
      <table className="qt-sr-only">
        <caption>Weekly average graded score</caption>
        <thead><tr><th scope="col">Week</th><th scope="col">Average score</th><th scope="col">Graded attempts</th></tr></thead>
        <tbody>
          {points.map((p) => (<tr key={p.weekKey}><td>{p.weekKey}</td><td>{p.avg}%</td><td>{p.count}</td></tr>))}
        </tbody>
      </table>
    </div>
  );
}

/* Top-level Charts tab: an overall score trend plus per-subject breakdowns.
   A single "focus subject" selector narrows the trend line (and dims the
   other bars) to one subject at a time, so progress on any individual
   subject — not just the aggregate — is easy to isolate. */
function ChartsView({ quizzes, historyLog, subjects, subjectMap, settings, subjectStats }) {
  const [chartSubject, setChartSubject] = useState("all");

  const combinedHistory = useMemo(() => getCombinedHistory(quizzes, historyLog), [quizzes, historyLog]);

  const completionBySubject = useMemo(() => {
    const map = {};
    subjects.forEach((s) => { map[s.id] = { subject: s, total: 0, completed: 0 }; });
    quizzes.forEach((q) => {
      const subj = subjectMap[q.subjectId];
      if (!subj) return;
      if (!map[q.subjectId]) map[q.subjectId] = { subject: subj, total: 0, completed: 0 };
      map[q.subjectId].total += 1;
      if (q.completed) map[q.subjectId].completed += 1;
    });
    return Object.values(map);
  }, [quizzes, subjects, subjectMap]);

  const trendEntries = useMemo(
    () => (chartSubject === "all" ? combinedHistory : combinedHistory.filter((h) => h.subjectId === chartSubject)),
    [combinedHistory, chartSubject]
  );
  const trendPoints = useMemo(() => aggregateWeeklyScores(trendEntries), [trendEntries]);
  const trendThreshold = chartSubject === "all" ? settings.passingThreshold : getThreshold(subjectMap[chartSubject], settings);
  const trendAccent = chartSubject === "all" ? "var(--teal)" : (subjectMap[chartSubject]?.color || "var(--teal)");

  const hasAnyData = quizzes.length > 0 || historyLog.length > 0;
  if (!hasAnyData) {
    return <div className="qt-empty">Add and complete a few quizzes to start seeing your progress charts here.</div>;
  }

  return (
    <div className="qt-charts-view">
      <div className="qt-chart-controls">
        <label className="qt-panel-field qt-chart-subject-field"><span>Focus subject</span>
          <FilterSelect value={chartSubject} onChange={setChartSubject} ariaLabel="Focus charts on a subject"
            options={[{ value: "all", label: "All subjects" }, ...subjects.map((s) => ({ value: s.id, label: `${s.icon} ${s.name}` }))]} />
        </label>
      </div>

      <div className="qt-charts-grid">
        <ChartCard title="Score trend over time" subtitle="Weekly average of graded quiz scores, with your pass threshold marked." full>
          <ScoreTrendChart points={trendPoints} threshold={trendThreshold} accentColor={trendAccent} />
        </ChartCard>
        <ChartCard title="Average score by subject" subtitle="Across all graded attempts to date.">
          <SubjectScoreBarChart subjects={subjects} subjectStats={subjectStats} settings={settings} highlightSubjectId={chartSubject} />
        </ChartCard>
        <ChartCard title="Completion by subject" subtitle="Quizzes marked done out of everything logged.">
          <CompletionBarChart completionBySubject={completionBySubject} highlightSubjectId={chartSubject} />
        </ChartCard>
      </div>
    </div>
  );
}

function WeekView({ quizzes, subjectMap, counts, onToggleComplete }) {
  return (
    <div className="qt-week-wrap">
      {WEEKDAYS.map((day, i) => {
        const items = quizzes.filter((q) => q.isRoutine && q.scheduledDay === day);
        return (
          <div className={`qt-day-col ${i === TODAY_IDX ? "is-today" : ""}`} key={day}>
            <div className="qt-day-head"><span>{day}</span><span className="qt-day-count">{counts[day] || 0}</span></div>
            <div className="qt-day-body">
              {items.length === 0 && <div className="qt-day-empty">No routine quizzes</div>}
              {items.map((q) => {
                const subj = subjectMap[q.subjectId] || { icon: "•", color: "#999" };
                return (
                  <button
                    key={q.id}
                    className={`qt-day-card ${q.completed ? "is-complete" : ""}`}
                    onClick={() => onToggleComplete(q.id)}
                    aria-pressed={q.completed}
                    aria-label={q.completed ? `Mark "${q.name}" as incomplete` : `Mark "${q.name}" as complete`}
                  >
                    <span className="qt-day-card-icon" style={{ color: subj.color }}>{subj.icon}</span>
                    <span className="qt-day-card-name">{q.name}</span>
                    {q.completed && <Icon name="check" size={12} className="qt-day-card-check" />}
                  </button>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function MonthView({ quizzes, subjectMap, settings, todayISO, onToggleComplete, onEdit }) {
  const [cursor, setCursor] = useState(() => { const d = new Date(); return { year: d.getFullYear(), month: d.getMonth() }; });
  const weeks = useMemo(() => buildMonthMatrix(cursor.year, cursor.month), [cursor]);
  const monthPrefix = `${cursor.year}-${pad2(cursor.month + 1)}`;
  const byDate = useMemo(() => {
    const map = {};
    quizzes.forEach((q) => { if (q.dueDate) { (map[q.dueDate] = map[q.dueDate] || []).push(q); } });
    return map;
  }, [quizzes]);
  /* Routine quizzes without a fixed due date recur weekly on their scheduled
     weekday, so — rather than being invisible on the calendar — group them
     by weekday and show a dashed "ghost" chip on every matching cell in the
     visible month. buildMonthMatrix's rows are always Mon..Sun (see WEEKDAYS),
     so a cell's column index maps directly to a weekday name. */
  const routineByDay = useMemo(() => {
    const map = Object.fromEntries(WEEKDAYS.map((d) => [d, []]));
    quizzes.forEach((q) => { if (q.isRoutine && q.scheduledDay && !q.dueDate) map[q.scheduledDay].push(q); });
    return map;
  }, [quizzes]);
  const monthQuizzes = useMemo(() => quizzes.filter((q) => q.dueDate && q.dueDate.startsWith(monthPrefix)), [quizzes, monthPrefix]);
  const monthCompleted = monthQuizzes.filter((q) => q.completed).length;

  const goPrev = () => setCursor((c) => { const m = c.month - 1 < 0 ? 11 : c.month - 1; const y = c.month - 1 < 0 ? c.year - 1 : c.year; return { year: y, month: m }; });
  const goNext = () => setCursor((c) => { const m = c.month + 1 > 11 ? 0 : c.month + 1; const y = c.month + 1 > 11 ? c.year + 1 : c.year; return { year: y, month: m }; });
  const goToday = () => { const d = new Date(); setCursor({ year: d.getFullYear(), month: d.getMonth() }); };

  return (
    <div className="qt-month-wrap">
      <div className="qt-month-head">
        <div className="qt-month-nav">
          <button className="qt-icon-btn" onClick={goPrev} aria-label="Previous month"><Icon name="chevronLeft" size={16}/></button>
          <span className="qt-month-title">{MONTH_NAMES[cursor.month]} {cursor.year}</span>
          <button className="qt-icon-btn" onClick={goNext} aria-label="Next month"><Icon name="chevronRight" size={16}/></button>
        </div>
        <div className="qt-month-summary">
          <button className="qt-btn qt-btn-ghost qt-month-today-btn" onClick={goToday}>Today</button>
          <span className="qt-month-summary-text">{monthQuizzes.length ? `${monthCompleted}/${monthQuizzes.length} due-date quizzes done this month` : "No dated quizzes this month"}</span>
        </div>
      </div>
      <div className="qt-month-grid">
        {WEEKDAYS.map((d) => <div className="qt-month-weekday" key={d}>{d}</div>)}
        {weeks.map((week, wi) => week.map((cell, ci) => {
          const dated = byDate[cell.iso] || [];
          const routineItems = cell.inMonth ? (routineByDay[WEEKDAYS[ci]] || []) : [];
          const items = [...dated, ...routineItems];
          const isToday = cell.iso === todayISO;
          return (
            <div className={`qt-month-cell ${cell.inMonth ? "" : "is-outside"} ${isToday ? "is-today" : ""}`} key={cell.iso + wi}>
              <div className="qt-month-daynum">{cell.day}</div>
              <div className="qt-month-items">
                {items.slice(0, 3).map((q) => {
                  const subj = subjectMap[q.subjectId] || { icon: "•", color: "#999" };
                  const isGhost = !q.dueDate;
                  return (
                    <button key={(isGhost ? "r-" : "d-") + q.id} className={`qt-month-chip ${q.completed ? "is-complete" : ""} ${isGhost ? "is-routine-ghost" : ""}`}
                      onClick={() => onEdit(q)} title={isGhost ? `${q.name} · routine, recurs every ${q.scheduledDay}` : q.name}>
                      <span style={{ color: subj.color }}>{subj.icon}</span>
                      <span className="qt-month-chip-name">{q.name}</span>
                      {isGhost && <Icon name="repeat" size={9}/>}
                    </button>
                  );
                })}
                {items.length > 3 && <div className="qt-month-more">+{items.length - 3} more</div>}
              </div>
            </div>
          );
        }))}
      </div>
    </div>
  );
}

function QuizModal({ subjects, settings, initial, onClose, onSave }) {
  const [name, setName] = useState(initial?.name || "");
  const [subjectId, setSubjectId] = useState(initial?.subjectId || subjects[0]?.id || "");
  const [dueDate, setDueDate] = useState(initial?.dueDate || "");
  const [link, setLink] = useState(initial?.link || "");
  const [isRoutine, setIsRoutine] = useState(initial?.isRoutine || false);
  const [scheduledDay, setScheduledDay] = useState(initial?.scheduledDay || "");
  const [trackScore, setTrackScore] = useState(initial?.trackScore || false);
  const [completed, setCompleted] = useState(initial?.completed || false);
  const [description, setDescription] = useState(initial?.description || "");
  const [scoreMode, setScoreMode] = useState(() => (typeof initial?.totalItems === "number" ? "items" : (typeof initial?.score === "number" ? "percent" : "items")));
  const [totalItems, setTotalItems] = useState(initial?.totalItems ?? "");
  const [correctItems, setCorrectItems] = useState(initial?.correctItems ?? "");
  const [percentScore, setPercentScore] = useState(initial?.score ?? "");

  useEffect(() => {
    const onKeyDown = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKeyDown);
    return () => window.removeEventListener("keydown", onKeyDown);
  }, [onClose]);

  const subject = subjects.find((s) => s.id === subjectId);
  const threshold = getThreshold(subject, settings);
  const previewPercent = scoreMode === "items"
    ? (totalItems !== "" && correctItems !== "" && Number(totalItems) > 0 ? Math.round((Number(correctItems) / Number(totalItems)) * 1000) / 10 : null)
    : (percentScore !== "" ? Number(percentScore) : null);

  const submit = (e) => {
    e.preventDefault();
    if (!name.trim()) return;
    const data = {
      id: initial?.id, name: name.trim(), subjectId, dueDate, isRoutine, trackScore, completed,
      description: description.trim(),
      link: link.trim(),
      scheduledDay: isRoutine ? (scheduledDay || null) : null,
      totalItems: null, correctItems: null, score: null,
    };
    if (trackScore) {
      if (scoreMode === "items") {
        data.totalItems = totalItems === "" ? null : Math.max(1, Number(totalItems));
        data.correctItems = correctItems === "" ? null : Math.max(0, Math.min(data.totalItems ?? Number(correctItems), Number(correctItems)));
      } else {
        data.score = percentScore === "" ? null : Math.max(0, Math.min(100, Number(percentScore)));
      }
    }
    onSave(data);
  };

  return (
    <div className="qt-modal-overlay" onClick={onClose}>
      <form className="qt-modal" onClick={(e) => e.stopPropagation()} onSubmit={submit} role="dialog" aria-modal="true" aria-label={initial ? "Edit quiz" : "New quiz"}>
        <div className="qt-modal-head"><h2>{initial ? "Edit quiz" : "New quiz"}</h2><button type="button" className="qt-icon-btn" onClick={onClose} aria-label="Close"><Icon name="x" size={16}/></button></div>
        <label className="qt-field"><span>Name</span><input autoFocus value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Lesson INT-5" required /></label>
        <label className="qt-field"><span>Subject</span><select value={subjectId} onChange={(e) => setSubjectId(e.target.value)}>{subjects.map((s) => (<option key={s.id} value={s.id}>{s.icon} {s.name}</option>))}</select></label>
        <label className="qt-field"><span>Due date (optional)</span><input type="date" value={dueDate} onChange={(e) => setDueDate(e.target.value)} /></label>
        <label className="qt-field"><span>Quiz link (optional)</span><input type="url" value={link} onChange={(e) => setLink(e.target.value)} placeholder="https://…" /></label>
        <label className="qt-field"><span>Notes</span><input value={description} onChange={(e) => setDescription(e.target.value)} placeholder="Optional description" /></label>
        <div className="qt-field-row">
          <label className="qt-checkline"><input type="checkbox" checked={isRoutine} onChange={(e) => setIsRoutine(e.target.checked)} /><span>Tag as Routine <em>(scheduled to a weekday)</em></span></label>
          {isRoutine && (
            <label className="qt-field" style={{ margin: "2px 0 0 26px" }}>
              <span>Scheduled day</span>
              <select value={scheduledDay} onChange={(e) => setScheduledDay(e.target.value)}>
                <option value="">Auto-assign (least busy day)</option>
                {WEEKDAYS.map((d) => (<option key={d} value={d}>{d}</option>))}
              </select>
            </label>
          )}
          <label className="qt-checkline"><input type="checkbox" checked={trackScore} onChange={(e) => setTrackScore(e.target.checked)} /><span>Track a score (exam)</span></label>
          <label className="qt-checkline"><input type="checkbox" checked={completed} onChange={(e) => setCompleted(e.target.checked)} /><span>Mark as completed</span></label>
        </div>

        {trackScore && (
          <div className="qt-field-row qt-grading-row">
            <div className="qt-grading-mode-toggle">
              <button type="button" className={`qt-toggle-btn qt-toggle-btn-sm ${scoreMode === "items" ? "active" : ""}`} onClick={() => setScoreMode("items")}>By item count</button>
              <button type="button" className={`qt-toggle-btn qt-toggle-btn-sm ${scoreMode === "percent" ? "active" : ""}`} onClick={() => setScoreMode("percent")}>Direct percent</button>
            </div>
            {scoreMode === "items" ? (
              <div className="qt-grading-inputs">
                <label className="qt-field qt-field-inline"><span>Total items</span><input type="number" min="1" value={totalItems} onChange={(e) => setTotalItems(e.target.value)} placeholder="e.g. 500" /></label>
                <label className="qt-field qt-field-inline"><span>Correct answers</span><input type="number" min="0" value={correctItems} onChange={(e) => setCorrectItems(e.target.value)} placeholder="e.g. 423" /></label>
              </div>
            ) : (
              <label className="qt-field"><span>Score (%)</span><input type="number" min="0" max="100" value={percentScore} onChange={(e) => setPercentScore(e.target.value)} placeholder="e.g. 85" /></label>
            )}
            <div className="qt-grading-preview">
              {previewPercent !== null ? (
                <span className={previewPercent >= threshold ? "qt-preview-pass" : "qt-preview-fail"}>
                  {previewPercent}% — {previewPercent >= threshold ? "Passing" : "Below passing"} (threshold {threshold}%)
                </span>
              ) : (
                <span className="qt-preview-empty">Enter a score to see the computed grade</span>
              )}
            </div>
          </div>
        )}

        <div className="qt-modal-actions"><button type="button" className="qt-btn qt-btn-ghost" onClick={onClose}>Cancel</button><button type="submit" className="qt-btn qt-btn-primary">{initial ? "Save changes" : "Add quiz"}</button></div>
      </form>
    </div>
  );
}

function SettingsModal({ subjects, settings, onAddSubject, onDeleteSubject, onSubjectThreshold, onGlobalThreshold, onClose }) {
  const [name, setName] = useState("");
  const [icon, setIcon] = useState("📗");
  const palette = [
    { color: "#1F6F63", soft: "#DCEFE9" }, { color: "#D48A1F", soft: "#FBE9CE" }, { color: "#C23B6B", soft: "#FBE0EA" },
    { color: "#3763A8", soft: "#DEE7F7" }, { color: "#7C4FB0", soft: "#EAE0F6" }, { color: "#1E8FA0", soft: "#D9F0F3" },
    { color: "#C4472B", soft: "#FADCD4" }, { color: "#4F8A2E", soft: "#E1F0D6" }, { color: "#B5308B", soft: "#F7DCEE" },
    { color: "#9A7B1F", soft: "#F4EACB" },
  ];
  const [colorIdx, setColorIdx] = useState(0);

  useEffect(() => {
    const onKeyDown = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKeyDown);
    return () => window.removeEventListener("keydown", onKeyDown);
  }, [onClose]);

  const submit = (e) => { e.preventDefault(); if (!name.trim()) return; onAddSubject(name.trim(), icon, palette[colorIdx].color, palette[colorIdx].soft); setName(""); };

  return (
    <div className="qt-modal-overlay" onClick={onClose}>
      <div className="qt-modal" onClick={(e) => e.stopPropagation()} role="dialog" aria-modal="true" aria-label="Settings">
        <div className="qt-modal-head"><h2>Settings</h2><button type="button" className="qt-icon-btn" onClick={onClose} aria-label="Close"><Icon name="x" size={16}/></button></div>

        <div className="qt-settings-section">
          <h3 className="qt-settings-heading">Grading</h3>
          <p className="qt-settings-helper">
            Graded quizzes compute their score as <strong>(correct ÷ total items) × 100</strong>. A quiz counts as
            <strong> Passed</strong> once that score meets the threshold below, otherwise it's <strong>Failed</strong> —
            no manual judgment calls. Status also separates <strong>Incomplete</strong> (not yet done) from
            <strong> Overdue</strong> (not done and past its due date), so nothing is ambiguous.
          </p>
          <label className="qt-field qt-field-inline">
            <span>Default passing threshold (%)</span>
            <input type="number" min="0" max="100" value={settings.passingThreshold} onChange={(e) => onGlobalThreshold(e.target.value)} />
          </label>
        </div>

        <div className="qt-settings-section">
          <h3 className="qt-settings-heading">Subjects</h3>
          <p className="qt-settings-helper">Optionally override the passing threshold per subject — leave blank to use the default above.</p>
          <div className="qt-subject-list">
            {subjects.map((s) => (
              <div className="qt-subject-row" key={s.id}>
                <span className="qt-subject-pill" style={{ background: s.soft, color: s.color }}>{s.icon} {s.name}</span>
                <div className="qt-subject-row-controls">
                  <input type="number" min="0" max="100" className="qt-subject-threshold-input" placeholder={`${settings.passingThreshold}`}
                    value={s.passThreshold ?? ""} onChange={(e) => onSubjectThreshold(s.id, e.target.value)} aria-label={`Passing threshold override for ${s.name}`} />
                  <button className="qt-icon-btn danger" onClick={() => onDeleteSubject(s.id)} aria-label={`Delete subject ${s.name}`}><Icon name="trash" size={13}/></button>
                </div>
              </div>
            ))}
          </div>
          <form className="qt-add-subject" onSubmit={submit}>
            <input className="qt-icon-input" value={icon} onChange={(e) => setIcon(e.target.value)} maxLength={2} aria-label="Subject icon (emoji)" />
            <input className="qt-name-input" value={name} onChange={(e) => setName(e.target.value)} placeholder="New subject name" aria-label="New subject name" />
            <div className="qt-swatches">{palette.map((p, i) => (<button type="button" key={i} className={`qt-swatch ${colorIdx === i ? "active" : ""}`} style={{ background: p.color }} onClick={() => setColorIdx(i)} aria-pressed={colorIdx === i} aria-label={`Color option ${i + 1}`} />))}</div>
            <button type="submit" className="qt-btn qt-btn-primary"><Icon name="plus" size={14}/> Add</button>
          </form>
        </div>
      </div>
    </div>
  );
}

.qt-completed-toggle::after { content:""; flex:1; height:1px; background: var(--line); margin-left: 4px; }
.qt-completed-toggle:hover { color: var(--ink); }
.qt-completed-toggle span:first-of-type { font-family:'Fraunces', serif; font-size: 14px; font-weight:600; color: var(--ink); }
.qt-completed-count { background: var(--paper); border:1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-family:'IBM Plex Mono', monospace; font-size: 11px; }
.qt-completed-hint { text-transform: uppercase; letter-spacing: 0.04em; font-size: 10.5px; }
.qt-completed-section .qt-table-wrap { margin-top: 10px; }
.qt-week-wrap { display:grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
.qt-day-col { background: var(--paper-raised); border:1px solid var(--line); border-radius: 12px; padding: 10px; min-height: 160px; display:flex; flex-direction:column; }
.qt-day-col.is-today { border-color: var(--teal); box-shadow: 0 0 0 1px var(--teal); }
.qt-day-head { display:flex; justify-content:space-between; align-items:center; font-family:'IBM Plex Mono', monospace; font-size:11.5px; font-weight:600; color: var(--ink-soft); margin-bottom: 8px; }
.qt-day-col.is-today .qt-day-head { color: var(--teal); }
.qt-day-count { background: var(--paper); border-radius: 999px; padding: 1px 7px; }
.qt-day-body { display:flex; flex-direction:column; gap:6px; flex:1; }
.qt-day-empty { font-size: 11px; color: var(--ink-soft); opacity:0.6; padding-top: 6px; }
.qt-day-card { display:flex; align-items:center; gap:6px; border:1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 7px 8px; font-size: 12px; text-align:left; cursor:pointer; }
.qt-day-card.is-complete { opacity: 0.55; text-decoration: line-through; }
.qt-day-card-name { flex:1; }
.qt-day-card-check { color: var(--teal); flex-shrink:0; }
.qt-month-wrap { background: var(--paper-raised); border:1px solid var(--line); border-radius: 14px; padding: 14px; }
.qt-month-head { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap: 10px; margin-bottom: 12px; }
.qt-month-nav { display:flex; align-items:center; gap: 8px; }
.qt-month-title { font-family:'Fraunces', serif; font-size: 18px; font-weight:600; min-width: 150px; text-align:center; }
.qt-month-summary { display:flex; align-items:center; gap: 10px; }
.qt-month-today-btn { padding: 6px 11px; font-size: 12px; }
.qt-month-summary-text { font-size: 12px; color: var(--ink-soft); }
.qt-month-grid { display:grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.qt-month-weekday { font-family:'IBM Plex Mono', monospace; font-size: 11px; font-weight:600; color: var(--ink-soft); text-align:center; padding-bottom: 4px; }
.qt-month-cell { background: var(--paper); border:1px solid var(--line); border-radius: 8px; padding: 6px; min-height: 78px; display:flex; flex-direction:column; gap: 4px; }
.qt-month-cell.is-outside { opacity: 0.4; }
.qt-month-cell.is-today { border-color: var(--teal); box-shadow: 0 0 0 1px var(--teal); }
.qt-month-daynum { font-family:'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); }
.qt-month-items { display:flex; flex-direction:column; gap: 3px; }
.qt-month-chip { display:flex; align-items:center; gap:4px; border:none; background: var(--paper-raised); border-radius: 6px; padding: 3px 5px; font-size: 10.5px; cursor:pointer; text-align:left; }
.qt-month-chip.is-complete { opacity: 0.5; text-decoration: line-through; }
.qt-month-chip.is-routine-ghost { background: transparent; border: 1px dashed var(--line); color: var(--ink-soft); }
.qt-month-chip.is-routine-ghost svg { margin-left: auto; flex-shrink: 0; opacity: 0.7; }
.qt-month-chip-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.qt-month-more { font-size: 10px; color: var(--ink-soft); padding-left: 4px; }
@media (max-width: 720px) { .qt-month-grid { font-size: 10px; } .qt-month-cell { min-height: 56px; } }
.qt-modal-overlay { position: fixed; inset:0; background: rgba(28,35,33,0.45); display:flex; align-items:center; justify-content:center; z-index: 50; padding: 20px; }
.qt-modal { background: var(--paper-raised); border-radius: 16px; padding: 22px; width: 100%; max-width: 440px; max-height: 88vh; overflow-y:auto; }
.qt-modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom: 14px; }
.qt-modal-head h2 { font-family:'Fraunces', serif; font-size: 20px; margin:0; }
.qt-field { display:flex; flex-direction:column; gap:5px; font-size: 12.5px; color: var(--ink-soft); font-weight:600; margin-bottom: 12px; }
.qt-field input, .qt-field select { font-family: 'Inter', sans-serif; font-size: 13.5px; color: var(--ink); border:1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-weight: 400; }
.qt-field-inline { margin-bottom: 0; }
.qt-field-row { display:flex; flex-direction:column; gap: 8px; margin: 14px 0; padding: 12px; background: var(--paper); border-radius: 10px; }
.qt-grading-row { gap: 10px; }
.qt-grading-mode-toggle { display:flex; background: var(--paper-raised); border:1px solid var(--line); border-radius: 8px; padding: 2px; align-self:flex-start; }
.qt-grading-inputs { display:flex; gap: 10px; }
.qt-grading-inputs .qt-field { flex:1; }
.qt-grading-preview { font-size: 12px; padding-top: 2px; }
.qt-preview-pass { color: var(--teal); font-weight: 600; }
.qt-preview-fail { color: var(--rose); font-weight: 600; }
.qt-preview-empty { color: var(--ink-soft); }
.qt-checkline { display:flex; align-items:center; gap:8px; font-size: 13px; }
.qt-checkline em { color: var(--ink-soft); font-style: normal; font-size: 11px; }
.qt-modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top: 8px; }
.qt-settings-section { margin-bottom: 18px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.qt-settings-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.qt-settings-heading { font-family:'Fraunces', serif; font-size: 15px; font-weight:600; margin: 0 0 8px; }
.qt-settings-helper { font-size: 12px; color: var(--ink-soft); line-height: 1.5; margin: 0 0 10px; }
.qt-subject-list { display:flex; flex-direction:column; gap:8px; margin-bottom: 16px; }
.qt-subject-row { display:flex; align-items:center; justify-content:space-between; gap: 10px; }
.qt-subject-row-controls { display:flex; align-items:center; gap: 6px; }
.qt-subject-threshold-input { width: 54px; border:1px solid var(--line); border-radius:6px; padding: 5px 6px; font-family:'IBM Plex Mono', monospace; font-size:12px; text-align:center; }
.qt-add-subject { display:flex; gap:6px; align-items:center; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--line); }
.qt-icon-input { width: 42px; text-align:center; border:1px solid var(--line); border-radius:8px; padding: 8px 4px; }
.qt-name-input { flex:1; min-width: 120px; border:1px solid var(--line); border-radius:8px; padding: 8px 10px; }
.qt-swatches { display:flex; gap:6px; flex-wrap: wrap; max-width: 100%; }
.qt-swatch { width:24px; height:24px; border-radius:50%; border: 2px solid transparent; cursor:pointer; box-shadow: 0 0 0 1px var(--line) inset; transition: transform .1s ease; }
.qt-swatch:hover { transform: scale(1.12); }
.qt-swatch.active { border-color: var(--ink); box-shadow: none; }
.qt-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color:#fff; padding: 10px 18px; border-radius: 10px; font-size: 13px; z-index: 60; box-shadow: 0 8px 24px rgba(0,0,0,0.2); max-width: calc(100vw - 32px); text-align: center; }

/* ================= Charts view ================= */
.qt-sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
.qt-charts-view { margin-top: 16px; }
.qt-chart-controls { display:flex; justify-content:flex-end; margin-bottom: 14px; }
.qt-chart-subject-field { min-width: 220px; }
.qt-charts-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items:start; }
.qt-chart-card { grid-column: span 1; background: var(--paper-raised); border:1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.qt-chart-card-full { grid-column: 1 / -1; }
.qt-chart-card-head { margin-bottom: 14px; }
.qt-chart-card-title { font-family:'Fraunces', serif; font-size: 15px; font-weight:600; margin: 0 0 4px; }
.qt-chart-card-subtitle { font-size: 12px; color: var(--ink-soft); margin: 0; line-height: 1.4; }

.qt-bar-chart { display:flex; flex-direction:column; gap: 16px; }
.qt-bar-row { display:grid; grid-template-columns: 132px 1fr 96px; align-items:center; gap: 10px; transition: opacity .15s ease; }
.qt-bar-row.is-dimmed { opacity: 0.38; }
.qt-bar-row-label { display:flex; align-items:center; gap:6px; min-width:0; }
.qt-bar-row-icon { flex-shrink:0; }
.qt-bar-row-name { font-size: 12.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.qt-bar-track { position:relative; height: 14px; background: var(--paper); border:1px solid var(--line); border-radius: 999px; overflow:hidden; }
.qt-bar-fill { height:100%; border-radius: 999px; transition: width .4s ease; }
.qt-bar-threshold-tick { position:absolute; top:-2px; bottom:-2px; width:2px; background: var(--gold); z-index:2; }
.qt-bar-row-value { font-size: 12px; text-align:right; white-space:nowrap; line-height: 1.3; }
.qt-bar-row-meta { display:block; font-size: 10px; color: var(--ink-soft); font-weight:400; white-space: normal; }

.qt-trend-chart { display:flex; flex-direction:column; gap: 8px; }
.qt-trend-svg { width:100%; height:auto; display:block; }

/* ================= Mobile / touch responsiveness ================= */
@media (max-width: 900px) {
  .qt-week-wrap { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 760px) {
  .qt-root { padding: 18px 14px; border-radius: 12px; }
  .qt-title { font-size: 26px; }
  .qt-subtitle { font-size: 13px; }

  /* Overview: snapshot bar drops the gauge onto its own line, insight cards stack full width */
  .qt-overview-primary { padding: 12px; gap: 10px; }
  .qt-mini-stats { gap: 12px; flex: 1 1 100%; justify-content: space-between; }
  .qt-mini-stat-label { font-size: 10px; }
  .qt-gauge-card { flex: 1 1 100%; justify-content: center; padding-top: 6px; border-top: 1px dashed var(--line); }
  .qt-overview-insights { flex-direction: column; }
  .qt-rec-card, .qt-focus-card { min-width: 0; }

  .qt-toolbar { margin: 16px 0 12px; gap: 8px; }
  .qt-view-toggle { width: 100%; }
  .qt-toggle-btn { flex: 1; justify-content:center; white-space: nowrap; padding: 8px 6px; }
  .qt-toolbar-actions { width: 100%; }
  .qt-search-wrap { flex: 1 1 auto; min-width: 0; }
  .qt-search-wrap, .qt-search-input { width: 100%; }
  .qt-filter-wrap .qt-btn span, .qt-filter-wrap .qt-btn { white-space: nowrap; }

  /* Filters open as a bottom sheet on mobile instead of a small anchored popover */
  .qt-filters-panel {
    position: fixed; left: 0; right: 0; bottom: 0; top: auto; width: auto;
    border-radius: 16px 16px 0 0; max-height: 80vh; overflow-y: auto; padding: 16px;
    box-shadow: 0 -8px 32px rgba(28,35,33,0.18);
  }
  .qt-more-menu { position: fixed; left: 12px; right: 12px; bottom: 12px; top: auto; width: auto; min-width: 0; }

  /* New quiz moves to a floating action button; the inline toolbar button steps aside */
  .qt-new-quiz-btn { display: none; }
  .qt-fab {
    display: flex; align-items:center; justify-content:center; position: fixed; right: 18px; bottom: 18px;
    width: 52px; height: 52px; border-radius: 50%; border: none; background: var(--ink); color: #fff;
    box-shadow: 0 8px 24px rgba(28,35,33,0.28); cursor: pointer; z-index: 45;
  }
  .qt-fab:active { transform: scale(0.94); }

  /* Roomier tap targets */
  .qt-icon-btn { width: 34px; height: 34px; }
  .qt-checkbox { width: 24px; height: 24px; }
  .qt-btn { padding: 10px 14px; }
  .qt-score-step-btn { width: 26px; height: 26px; }

  /* iOS zooms the page if a focused input's font-size is under 16px — keep every
     interactive field at 16px+ on small screens so tapping in never jump-zooms. */
  .qt-search-input, .qt-select, .qt-score-input, .qt-field input, .qt-field select,
  .qt-icon-input, .qt-name-input, .qt-subject-threshold-input { font-size: 16px; }
  .qt-score-input { width: 60px; }
  .qt-score-input-sm { width: 52px; }

  .qt-modal-overlay { padding: 10px; align-items: flex-end; }
  .qt-modal { padding: 18px; border-radius: 14px; max-height: 92vh; max-width: 100%; }

  /* Table -> stacked cards. Each <tr> becomes a card; columns that need a label
     get one from data-label, the checkbox+name pair stay together up top, and
     the action buttons sit full-width at the bottom. */
  .qt-table-wrap { overflow-x: visible; background: transparent; border: none; }
  .qt-table { min-width: 0; width: 100%; border-spacing: 0 10px; border-collapse: separate; }
  .qt-table thead { display: none; }
  .qt-table tbody { display: block; }
  .qt-table tr {
    display: grid; grid-template-columns: 30px 1fr; align-items: center;
    gap: 4px 10px; background: var(--paper-raised); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; margin-bottom: 10px;
  }
  .qt-table tr.is-overdue { border-color: var(--rose); }
  .qt-table td { display: block; padding: 0; border-bottom: none; }
  .qt-table td:nth-child(1) { grid-column: 1; grid-row: 1; }
  .qt-table td:nth-child(2) { grid-column: 2; grid-row: 1; }
  .qt-table td[data-label] {
    grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0 0; margin-top: 8px; border-top: 1px dashed var(--line);
  }
  .qt-table td[data-label]::before {
    content: attr(data-label); font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--ink-soft); flex-shrink: 0;
  }
  .qt-table td:last-child { grid-column: 1 / -1; padding-top: 10px; }
  .qt-table td:last-child .qt-row-actions { justify-content: flex-end; opacity: 1; }
  .qt-name-cell { cursor: pointer; }

  .qt-month-head { flex-direction: column; align-items: flex-start; }
  .qt-month-title { min-width: 0; }
  .qt-grading-inputs { flex-direction: column; }
  .qt-add-subject { align-items: stretch; }
  .qt-name-input { width: 100%; }

  .qt-charts-grid { grid-template-columns: 1fr; }
  .qt-chart-card { padding: 14px; }
  .qt-chart-controls { justify-content: stretch; }
  .qt-chart-subject-field { width: 100%; min-width: 0; }
  .qt-bar-row { grid-template-columns: 92px 1fr 70px; gap: 8px; }
  .qt-bar-row-name { font-size: 11.5px; }
  .qt-sort-field-row .qt-select { font-size: 16px; }
}
@media (max-width: 480px) {
  .qt-week-wrap { grid-template-columns: 1fr; }
  .qt-month-grid { font-size: 9px; }
  .qt-month-cell { min-height: 44px; padding: 4px; }
}
</style>
</body>
