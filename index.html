<script>
  // ---- localStorage-backed shim matching the window.storage API ----
  window.storage = {
    async get(key, shared) {
      try {
        const raw = localStorage.getItem((shared ? "shared:" : "") + key);
        if (raw === null || raw === undefined) return null;
        return { key, value: raw, shared: !!shared };
      } catch (e) { throw e; }
    },
    async set(key, value, shared) {
      localStorage.setItem((shared ? "shared:" : "") + key, value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared) {
      localStorage.removeItem((shared ? "shared:" : "") + key);
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared) {
      const pfx = (shared ? "shared:" : "") + (prefix || "");
      const keys = Object.keys(localStorage).filter((k) => k.startsWith(pfx)).map((k) => k.replace(/^shared:/, ""));
      return { keys, prefix, shared: !!shared };
    },
  };
</script>

const WEEKDAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const TODAY_IDX = (new Date().getDay() + 6) % 7;

const DEFAULT_SUBJECTS = [
  { id: "sub-lessons", name: "Spanish Lessons Series", icon: "📘", color: "#1F6F63", soft: "#DCEFE9", passThreshold: null },
  { id: "sub-exams", name: "Spanish Exam Series", icon: "📝", color: "#D48A1F", soft: "#FBE9CE", passThreshold: null },
  { id: "sub-estar", name: "Spanish Estar", icon: "🌱", color: "#C23B6B", soft: "#FBE0EA", passThreshold: null },
];

const DEFAULT_SETTINGS = {
  passingThreshold: 80,
  visibleColumns: { subject: true, dueDate: true, routine: true, score: true, status: true },
};

const uid = (p = "id") => `${p}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;

// Given a full quiz name and the list of existing quiz names in the project,
// returns the next available "Name (N)" variant that doesn't collide with
// anything already in the list. The original name is NEVER altered/stripped —
// e.g. "Spanish INT-2" -> "Spanish INT-2 (1)" -> "Spanish INT-2 (2)", even if
// other unrelated quizzes named "Spanish INT-1", "Spanish INT-3", etc. exist.
// If this name is itself already a "(N)" duplicate, we still just keep
// appending after the full name (so re-duplicating "X (1)" tries "X (1) (1)"),
// rather than trying to parse/reuse a "base" name.
const getNextDuplicateName = (sourceName, existingNames) => {
  const nameSet = new Set(existingNames.map((n) => (n || "").trim().toLowerCase()));
  let n = 1;
  let candidate = `${sourceName} (${n})`;
  while (nameSet.has(candidate.trim().toLowerCase())) {
    n += 1;
    candidate = `${sourceName} (${n})`;
  }
  return candidate;
};

/* ---------- grading helpers ----------
   A quiz can be graded two ways:
   1) Item-based (recommended): totalItems + correctItems -> percent is computed automatically.
   2) Direct percent: a manually entered score, for quizzes without a fixed item count.
   Whichever is present is used; item-based always takes priority if both exist. */
function getScorePercent(q) {
  if (typeof q.totalItems === "number" && q.totalItems > 0 && typeof q.correctItems === "number") {
    return Math.round((q.correctItems / q.totalItems) * 1000) / 10;
  }
  if (typeof q.score === "number") return q.score;
  return null;
}
function getThreshold(subject, settings) {
  if (subject && typeof subject.passThreshold === "number") return subject.passThreshold;
  return settings.passingThreshold;
}
function getGrade(q, subject, settings) {
  const percent = getScorePercent(q);
  if (percent === null) return null;
  const threshold = getThreshold(subject, settings);
  return { percent, threshold, pass: percent >= threshold };
}
/* Status is fully derived — never a mystery toggle:
   - "incomplete": not marked done, and (no due date, or due date hasn't passed)
   - "overdue": not marked done, and the due date has passed
   - "passed" / "failed": marked done, graded, compared against the pass threshold
   - "completed": marked done, not graded (nothing to compare) */
function getQuizStatus(q, subject, settings, todayISO) {
  if (!q.completed) {
    if (q.dueDate && q.dueDate < todayISO) return "overdue";
    return "incomplete";
  }
  if (q.trackScore) {
    const grade = getGrade(q, subject, settings);
    if (grade) return grade.pass ? "passed" : "failed";
  }
  return "completed";
}
const STATUS_META = {
  incomplete: { label: "Incomplete", color: "var(--ink-soft)", soft: "var(--paper)" },
  overdue: { label: "Overdue", color: "var(--rose)", soft: "var(--rose-soft)" },
  completed: { label: "Done", color: "var(--teal)", soft: "var(--teal-soft)" },
  passed: { label: "Passed", color: "var(--teal)", soft: "var(--teal-soft)" },
  failed: { label: "Failed", color: "var(--rose)", soft: "var(--rose-soft)" },
};

/* ---------- normalization / migration ----------
   Accepts data from any prior version of this app (raw "item" + flat "score")
   and coerces it into the current shape so old backups and old localStorage
   data always load safely instead of crashing the UI. */
function normalizeSubject(s) {
  return {
    id: s.id || uid("sub"),
    name: s.name || "Untitled subject",
    icon: s.icon || "📘",
    color: s.color || "#1F6F63",
    soft: s.soft || "#E4EFEC",
    passThreshold: typeof s.passThreshold === "number" ? s.passThreshold : null,
  };
}
function normalizeQuiz(q) {
  const totalItems = typeof q.totalItems === "number" ? q.totalItems : (typeof q.item === "number" ? q.item : null);
  let correctItems = typeof q.correctItems === "number" ? q.correctItems : null;
  let score = typeof q.score === "number" ? q.score : null;
  if (totalItems !== null && correctItems === null && score !== null) {
    correctItems = Math.round((score / 100) * totalItems);
    score = null;
  }
  if (totalItems !== null) score = null;
  return {
    id: q.id || uid("q"),
    name: q.name || "Untitled quiz",
    subjectId: q.subjectId || "",
    dueDate: q.dueDate || "",
    isRoutine: !!q.isRoutine,
    scheduledDay: q.scheduledDay || null,
    completed: !!q.completed,
    trackScore: !!q.trackScore,
    totalItems, correctItems, score,
    description: q.description || "",
    link: q.link || "",
    // completedAt / completedWeek track *when* the current completion happened so
    // routine quizzes can be auto-reset once the ISO week rolls over (see
    // performWeeklyRollover). One-off quizzes just keep completedAt as a record.
    completedAt: q.completedAt || null,
    completedWeek: q.completedWeek || null,
  };
}
function normalizeHistoryEntry(h) {
  return {
    id: h.id || uid("hist"),
    quizId: h.quizId || "",
    quizName: h.quizName || "Untitled quiz",
    subjectId: h.subjectId || "",
    week: h.week || "",
    date: h.date || null,
    trackScore: !!h.trackScore,
    totalItems: typeof h.totalItems === "number" ? h.totalItems : null,
    correctItems: typeof h.correctItems === "number" ? h.correctItems : null,
    score: typeof h.score === "number" ? h.score : null,
    link: h.link || "",
  };
}
/* ISO 8601 week key, e.g. "2026-W28". Used to detect when a routine quiz's
   completion belongs to a previous week so it can be archived and reset. */
function getISOWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  const weekNum = 1 + Math.round(((d - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay() + 6) % 7)) / 7);
  return `${d.getUTCFullYear()}-W${String(weekNum).padStart(2, "0")}`;
}
function normalizeSettings(s) {
  const base = s || {};
  return {
    passingThreshold: typeof base.passingThreshold === "number" ? base.passingThreshold : DEFAULT_SETTINGS.passingThreshold,
    visibleColumns: { ...DEFAULT_SETTINGS.visibleColumns, ...(base.visibleColumns || {}) },
  };
}

/* ---------- routine "next occurrence" date ----------
   Routine quizzes are scheduled to a weekday (e.g. "Mon"), not a calendar
   date, so they normally show no Due date. This computes the next upcoming
   calendar date that weekday falls on (today counts as "next" if it matches),
   purely for display — it's informational, not a real deadline, so it never
   feeds into overdue logic. */
const WEEKDAY_TO_JSIDX = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
function getNextRoutineDate(scheduledDay, fromISO) {
  if (!scheduledDay || !(scheduledDay in WEEKDAY_TO_JSIDX)) return null;
  const from = fromISO ? new Date(fromISO + "T00:00:00") : new Date();
  const targetJsDay = WEEKDAY_TO_JSIDX[scheduledDay];
  const diff = (targetJsDay - from.getDay() + 7) % 7;
  const next = new Date(from);
  next.setDate(from.getDate() + diff);
  return next.toISOString().slice(0, 10);
}
function formatShortDate(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  return `${MONTH_NAMES[m - 1].slice(0, 3)} ${d}`;
}

function dayCounts(quizzes) {
  const counts = Object.fromEntries(WEEKDAYS.map((d) => [d, 0]));
  quizzes.forEach((q) => { if (q.isRoutine && q.scheduledDay) counts[q.scheduledDay] = (counts[q.scheduledDay] || 0) + 1; });
  return counts;
}
function leastBusyDay(quizzes) {
  const counts = dayCounts(quizzes);
  const min = Math.min(...WEEKDAYS.map((d) => counts[d]));
  const candidates = WEEKDAYS.filter((d) => counts[d] === min);
  return candidates[Math.floor(Math.random() * candidates.length)];
}
function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function getRecommendation(quizzes, subjectMap, settings) {
  const scored = quizzes.filter((q) => q.trackScore && q.completed && getScorePercent(q) !== null);
  if (scored.length < 3) {
    return { tier: "insufficient", label: "Gathering data", detail: `Log scores for ${3 - scored.length} more completed exam${3 - scored.length === 1 ? "" : "s"} to unlock a recommendation.`, avg: null, count: scored.length };
  }
  const avg = scored.reduce((a, b) => a + getScorePercent(b), 0) / scored.length;
  const passRate = scored.filter((q) => { const g = getGrade(q, subjectMap[q.subjectId], settings); return g && g.pass; }).length / scored.length;
  if (avg >= 85 && passRate >= 0.8) return { tier: "ready", label: "Ready to level up", detail: `Averaging ${avg.toFixed(1)}% across ${scored.length} exams, passing ${Math.round(passRate * 100)}% of them — you're ready for the next level.`, avg, count: scored.length };
  if (avg >= 70) return { tier: "close", label: "Almost there", detail: `Averaging ${avg.toFixed(1)}% across ${scored.length} exams. A little more practice before testing up.`, avg, count: scored.length };
  return { tier: "practice", label: "Keep practicing", detail: `Averaging ${avg.toFixed(1)}% across ${scored.length} exams. Focus on review before advancing a level.`, avg, count: scored.length };
}

/* ---------- performance / priority helpers ----------
   Looks at each subject's graded history to find where the person is failing
   most often, then scores every quiz so the weakest, least-mastered material
   can be surfaced first (via the "Priority" sort and the Focus card). */
function getSubjectStats(quizzes, settings, subjectMap) {
  const stats = {};
  Object.keys(subjectMap).forEach((id) => { stats[id] = { attempts: 0, passes: 0, totalScore: 0 }; });
  quizzes.forEach((q) => {
    if (!q.trackScore || !q.completed) return;
    const percent = getScorePercent(q);
    if (percent === null) return;
    if (!stats[q.subjectId]) stats[q.subjectId] = { attempts: 0, passes: 0, totalScore: 0 };
    const s = stats[q.subjectId];
    s.attempts += 1;
    s.totalScore += percent;
    const grade = getGrade(q, subjectMap[q.subjectId], settings);
    if (grade && grade.pass) s.passes += 1;
  });
  Object.keys(stats).forEach((id) => {
    const s = stats[id];
    s.avgScore = s.attempts ? s.totalScore / s.attempts : null;
    s.passRate = s.attempts ? s.passes / s.attempts : null;
    s.failRate = s.attempts ? 1 - s.passRate : 0;
  });
  return stats;
}
function getWeakestSubject(subjectStats, subjectMap, minAttempts = 2) {
  let weakest = null;
  Object.entries(subjectStats).forEach(([id, s]) => {
    if (s.attempts < minAttempts) return;
    if (!weakest || s.failRate > weakest.failRate || (s.failRate === weakest.failRate && s.avgScore < weakest.avgScore)) {
      weakest = { id, ...s, subject: subjectMap[id] };
    }
  });
  return weakest;
}
/* Higher score = more urgent to review. Combines: how often this whole subject
   is failed, how low this specific quiz's own score was, and whether it's
   currently failed or overdue. Ungraded/not-yet-attempted quizzes lean on the
   subject's track record so weak subjects still bubble their open work up. */
function getPriorityScore(q, subject, settings, subjectStats, todayISO) {
  const stats = (subject && subjectStats[subject.id]) || { failRate: 0, avgScore: null, attempts: 0 };
  const status = getQuizStatus(q, subject, settings, todayISO);
  const ownPercent = getScorePercent(q);
  const effectiveScore = ownPercent !== null ? ownPercent : (stats.avgScore !== null ? stats.avgScore : 100);
  let score = stats.failRate * 60 + Math.max(0, 100 - effectiveScore) * 0.6;
  if (status === "failed") score += 45;
  if (status === "overdue") score += 25;
  if (status === "incomplete" && stats.failRate > 0.3) score += 15;
  if (status === "passed" || status === "completed") score -= 20;
  return score;
}

/* ---------- table sorting ----------
   Each sortable column has an ascending-order comparator plus a sensible
   default direction — score/priority default to descending ("best/most
   urgent first" reads more naturally than ascending), everything else
   defaults ascending. Clicking a header that isn't the active sort column
   switches to that column at its default direction; clicking the already-
   active header flips direction. This same table backs both the column
   headers (desktop) and the "Sort by" dropdown in the filters panel
   (mobile, where headers are hidden), so the two controls always agree. */
const SORT_FIELDS = {
  priority: {
    label: "Priority (weak areas)", defaultDir: "desc",
    compare: (a, b, ctx) => getPriorityScore(a, ctx.subjectMap[a.subjectId], ctx.settings, ctx.subjectStats, ctx.todayISO) - getPriorityScore(b, ctx.subjectMap[b.subjectId], ctx.settings, ctx.subjectStats, ctx.todayISO),
  },
  name: { label: "Name", defaultDir: "asc", compare: (a, b) => a.name.localeCompare(b.name) },
  subject: {
    label: "Subject", defaultDir: "asc",
    compare: (a, b, ctx) => (ctx.subjectMap[a.subjectId]?.name || "").localeCompare(ctx.subjectMap[b.subjectId]?.name || ""),
  },
  dueDate: { label: "Due date", defaultDir: "asc", compare: (a, b) => (a.dueDate || "").localeCompare(b.dueDate || "") },
  routine: { label: "Routine", defaultDir: "desc", compare: (a, b) => (a.isRoutine ? 1 : 0) - (b.isRoutine ? 1 : 0) },
  score: { label: "Score", defaultDir: "desc", compare: (a, b) => (getScorePercent(a) ?? -1) - (getScorePercent(b) ?? -1) },
  status: {
    label: "Status", defaultDir: "asc",
    compare: (a, b, ctx) => {
      const order = { overdue: 0, failed: 1, incomplete: 2, completed: 3, passed: 4 };
      const sa = order[getQuizStatus(a, ctx.subjectMap[a.subjectId], ctx.settings, ctx.todayISO)] ?? 5;
      const sb = order[getQuizStatus(b, ctx.subjectMap[b.subjectId], ctx.settings, ctx.todayISO)] ?? 5;
      return sa - sb;
    },
  },
};
function sortQuizzes(list, sortBy, sortDir, ctx) {
  const field = SORT_FIELDS[sortBy] || SORT_FIELDS.priority;
  const dir = sortDir === "asc" ? 1 : -1;
  return [...list].sort((a, b) => field.compare(a, b, ctx) * dir);
}

/* ---------- shared "completed work" timeline ----------
   Used by both the History view and the Charts view. Merges three sources
   into one chronological list of completed attempts:
   - one-off quizzes that are currently marked complete
   - routine quizzes completed *this* ISO week (not yet archived on rollover)
   - everything already archived in historyLog
   See performWeeklyRollover in App for why routine completions only reach
   historyLog after the week changes — without also surfacing this week's
   routine completions directly, they'd be invisible everywhere until the
   week rolled over. */
function getCombinedHistory(quizzes, historyLog) {
  const oneOffDone = quizzes.filter((q) => !q.isRoutine && q.completed).map((q) => ({
    id: `oneoff-${q.id}`, quizId: q.id, quizName: q.name, subjectId: q.subjectId, week: null,
    date: q.completedAt, trackScore: q.trackScore, totalItems: q.totalItems, correctItems: q.correctItems,
    score: q.score, link: q.link, isOneOff: true, isCurrent: false,
  }));
  const routineDoneThisWeek = quizzes.filter((q) => q.isRoutine && q.completed).map((q) => ({
    id: `routine-current-${q.id}`, quizId: q.id, quizName: q.name, subjectId: q.subjectId, week: q.completedWeek,
    date: q.completedAt, trackScore: q.trackScore, totalItems: q.totalItems, correctItems: q.correctItems,
    score: q.score, link: q.link, isOneOff: false, isCurrent: true,
  }));
  return [...oneOffDone, ...routineDoneThisWeek, ...historyLog].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
}
/* Percent for a history/timeline entry — mirrors getScorePercent(quiz) but
   for the lighter-weight entry shape used in the combined timeline above. */
function getEntryPercent(entry) {
  if (!entry.trackScore) return null;
  if (typeof entry.totalItems === "number" && entry.totalItems > 0 && typeof entry.correctItems === "number") {
    return Math.round((entry.correctItems / entry.totalItems) * 1000) / 10;
  }
  if (typeof entry.score === "number") return entry.score;
  return null;
}
/* Groups graded, dated timeline entries into ISO weeks and averages their
   score — smooths noisy day-to-day attempts into a readable trend line for
   the Charts view. Ungraded or undated entries are skipped (nothing to
   plot). */
function aggregateWeeklyScores(entries) {
  const byWeek = new Map();
  entries.forEach((e) => {
    if (!e.date) return;
    const percent = getEntryPercent(e);
    if (percent === null) return;
    const weekKey = e.week || getISOWeek(new Date(e.date + "T00:00:00"));
    if (!byWeek.has(weekKey)) byWeek.set(weekKey, { weekKey, total: 0, count: 0 });
    const bucket = byWeek.get(weekKey);
    bucket.total += percent;
    bucket.count += 1;
  });
  return Array.from(byWeek.values())
    .map((b) => ({ weekKey: b.weekKey, avg: Math.round((b.total / b.count) * 10) / 10, count: b.count }))
    .sort((a, b) => a.weekKey.localeCompare(b.weekKey));
}

/* ---------- month calendar helpers ---------- */
function pad2(n) { return String(n).padStart(2, "0"); }
function isoFromParts(y, m, d) { return `${y}-${pad2(m + 1)}-${pad2(d)}`; }
function buildMonthMatrix(year, month) {
  const startWeekday = (new Date(year, month, 1).getDay() + 6) % 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();
  const cells = [];
  for (let i = 0; i < startWeekday; i++) {
    const d = daysInPrevMonth - startWeekday + 1 + i;
    const m = month - 1 < 0 ? 11 : month - 1;
    const y = month - 1 < 0 ? year - 1 : year;
    cells.push({ iso: isoFromParts(y, m, d), day: d, inMonth: false });
  }
  for (let d = 1; d <= daysInMonth; d++) cells.push({ iso: isoFromParts(year, month, d), day: d, inMonth: true });
  while (cells.length % 7 !== 0) {
    const idx = cells.length - (startWeekday + daysInMonth);
    const d = idx + 1;
    const m = month + 1 > 11 ? 0 : month + 1;
    const y = month + 1 > 11 ? year + 1 : year;
    cells.push({ iso: isoFromParts(y, m, d), day: d, inMonth: false });
  }
  const weeks = [];
  for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
  return weeks;
}

/* Scopes -------------------------------------------------------------------
   This app is meant for MULTIPLE PEOPLE sharing one quiz library, so
   "drive.file" alone isn't enough: drive.file only lets a signed-in account
   see files THAT ACCOUNT created (or opened through a Google Picker). A
   student who didn't create the file would see nothing with drive.file
   alone.
   Trade-off we're accepting: "drive.readonly" grants READ access to
   *everything* already shared with the signed-in account, not just this
   app's one file — broader than we'd like, but it's the only way for an
   account that didn't create the file to find and read it by name.
   To keep that broader read grant from becoming a broader WRITE grant, this
   app enforces admin-vs-viewer itself (see ADMIN_EMAILS): only admins are
   allowed to push changes, via drive.file, which is the scope that let the
   admin create the file in the first place. Everyone else is treated as
   read-only in this app's UI regardless of what Drive itself would
   otherwise let them do. */
const DRIVE_SCOPES = [
  "https://www.googleapis.com/auth/drive.file",
  "https://www.googleapis.com/auth/drive.readonly",
  "https://www.googleapis.com/auth/userinfo.email",
].join(" ");

/* Optional but recommended once the shared file exists ----------------------
   Leave this blank the very first time: the admin connects, the app creates
   the file, and its ID gets logged to the console and shown in a toast.
   Paste that ID in here afterward. Once set, every account (admin or
   viewer) fetches this EXACT file by ID instead of searching Drive by name —
   deterministic, and immune to duplicate-name mixups if a second file with
   the same name ever turns up. Leaving it blank keeps the old
   search-by-name fallback working, just less precise. */
const DRIVE_SHARED_FILE_ID_RAW = "https://drive.google.com/file/d/1nBZvimHuAMcTgD688rL5YAydgOaraMEI/view?usp=drive_link"; // <-- paste the file ID (or the full share link) here after the admin's first connect

// The Drive API's `files/{fileId}` endpoint needs the bare ID, e.g.
// "1nBZvimHuAMcTgD688rL5YAydgOaraMEI" — NOT the full drive.google.com share
// link. Pasting the "Copy link" URL (instead of just the ID logged to the
// console after the admin's first connect) is a common mistake, so this
// pulls the ID out of the common Drive URL shapes automatically:
//   https://drive.google.com/file/d/<ID>/view?usp=...
//   https://drive.google.com/open?id=<ID>
//   https://docs.google.com/document/d/<ID>/edit
// and falls through unchanged if it already looks like a bare ID.
function extractDriveFileId(value) {
  const v = (value || "").trim();
  if (!v) return "";
  const patterns = [/\/d\/([a-zA-Z0-9_-]{10,})/, /[?&]id=([a-zA-Z0-9_-]{10,})/];
  for (const re of patterns) {
    const m = v.match(re);
    if (m) return m[1];
  }
  return v; // already a bare ID (or an unrecognized shape — let the API 404 surface it)
}

const DRIVE_SHARED_FILE_ID = extractDriveFileId(DRIVE_SHARED_FILE_ID_RAW);

const DRIVE_UPLOAD_API = "https://www.googleapis.com/upload/drive/v3/files";

function driveIsConfigured() {

function driveIsAdminEmail(email) {
  if (!ADMIN_EMAILS.length) return true; // fail-safe: role-checking off, everyone is admin
  if (!email) return false;
  const lower = email.toLowerCase();
  return ADMIN_EMAILS.some((e) => e.toLowerCase() === lower);

// Loads the Google Identity Services script if it hasn't finished loading yet
// (it's tagged async/defer in <head>, so on a slow connection it may not be
// ready the instant the user clicks "Connect").
function driveWaitForGis(timeoutMs = 8000) {
  return new Promise((resolve, reject) => {
    const start = Date.now();
    const check = () => {
      if (window.google && window.google.accounts && window.google.accounts.oauth2) {
        resolve();
      } else if (Date.now() - start > timeoutMs) {
        reject(new Error("Google sign-in script didn't load in time. Check your connection and try again."));
      } else {
        setTimeout(check, 100);
      }
    };
    check();
  });
}

// Wraps GIS's callback-based token client in a promise. `interactive: false`
// attempts a silent (no popup) reauth for returning users; if that fails the
// caller should retry with `interactive: true` to show the consent popup.
function driveRequestToken(interactive) {
  return new Promise((resolve, reject) => {
    try {
      const client = window.google.accounts.oauth2.initTokenClient({
        client_id: DRIVE_CLIENT_ID,
        scope: DRIVE_SCOPES,
        prompt: interactive ? "consent" : "",
        callback: (resp) => {
          if (resp && resp.access_token) resolve(resp.access_token);
          else reject(new Error(resp?.error_description || resp?.error || "Sign-in didn't return an access token."));
        },
        error_callback: (err) => reject(new Error(err?.message || "Google sign-in failed or was cancelled.")),
      });
      client.requestAccessToken({ prompt: interactive ? "consent" : "" });
    } catch (e) {
      reject(e);
    }
  });
}

function driveRevokeToken(token) {
  return new Promise((resolve) => {
    try {
      if (token && window.google?.accounts?.oauth2?.revoke) {
        window.google.accounts.oauth2.revoke(token, () => resolve());
      } else {
        resolve();
      }
    } catch (e) {
      resolve();
    }
  });
}

async function driveApiFetchJson(url, token, options = {}) {
  const res = await fetch(url, {
    ...options,
    headers: { Authorization: `Bearer ${token}`, ...(options.headers || {}) },
  });
  if (!res.ok) {
    const body = await res.text().catch(() => "");
    const err = new Error(`Drive API error ${res.status}: ${body.slice(0, 300)}`);
    err.status = res.status;
    throw err;
  }
  return res.status === 204 ? null : res.json();
}

async function driveFetchEmail(token) {
  const data = await driveApiFetchJson("https://www.googleapis.com/oauth2/v3/userinfo", token);
  return data?.email || null;
}

// Fetches one exact file by ID. Used when DRIVE_SHARED_FILE_ID is pinned —
// deterministic, no ambiguity even if other files share the same name.
async function driveGetFileById(token, fileId) {
  try {
    const data = await driveApiFetchJson(`${DRIVE_API}/${fileId}?fields=id,name,modifiedTime,trashed`, token);
    if (!data || data.trashed) return null;
    return data;
  } catch (e) {
    if (e.status === 404 || e.status === 403) return null; // not found, or not shared with this account
    throw e;
  }
}

// Finds the shared data file by exact name. Works for the admin (who created
// it, visible via drive.file) and for viewers (visible via drive.readonly
// once the admin has shared it with them in Drive).
async function driveFindFile(token) {
  const q = encodeURIComponent(`name = '${DRIVE_FILE_NAME.replace(/'/g, "\\'")}' and trashed = false`);
  const data = await driveApiFetchJson(`${DRIVE_API}?q=${q}&fields=files(id,name,modifiedTime)&spaces=drive&pageSize=10`, token);
  const files = data?.files || [];
  if (!files.length) return null;
  // If more than one turns up (e.g. duplicate uploads), prefer the most recently modified.
  return files.sort((a, b) => new Date(b.modifiedTime) - new Date(a.modifiedTime))[0];
}

// Admin-only: creates the file the first time sync is turned on for this library.
async function driveCreateFile(token, contentObj) {
  const boundary = "quiztracker" + Math.random().toString(36).slice(2);
  const metadata = { name: DRIVE_FILE_NAME, mimeType: "application/json" };
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(contentObj)}\r\n--${boundary}--`;
  return driveApiFetchJson(`${DRIVE_UPLOAD_API}?uploadType=multipart&fields=id,modifiedTime`, token, {
    method: "POST",
    headers: { "Content-Type": `multipart/related; boundary=${boundary}` },
    body,
  });
}

async function driveGetModifiedTime(token, fileId) {
  const data = await driveApiFetchJson(`${DRIVE_API}/${fileId}?fields=modifiedTime`, token);
  return data?.modifiedTime || null;
}

async function driveDownloadFile(token, fileId) {
  const res = await fetch(`${DRIVE_API}/${fileId}?alt=media`, { headers: { Authorization: `Bearer ${token}` } });
  if (!res.ok) throw new Error(`Drive download failed: ${res.status}`);
  return res.json();
}

// Optimistic-concurrency write: the caller must pass the modifiedTime it last
// knew about (`knownModifiedTime`). We re-check the file's *current*
// modifiedTime immediately before writing; if it moved since our last known
// value, someone else wrote in between — stop and surface a conflict instead
// of silently overwriting their change.
async function driveUpdateFile(token, fileId, contentObj, knownModifiedTime) {
  const current = await driveGetModifiedTime(token, fileId);
  if (knownModifiedTime && current && current !== knownModifiedTime) {
    const err = new Error("Drive file changed since last sync.");
    err.isConflict = true;
    err.remoteModifiedTime = current;
    throw err;
  }
  const data = await driveApiFetchJson(`${DRIVE_UPLOAD_API}/${fileId}?uploadType=media&fields=modifiedTime`, token, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(contentObj),
  });
  return data?.modifiedTime || null;
}

    saveTimer.current = setTimeout(async () => {
      try {
        await window.storage.set(STORAGE_KEY, JSON.stringify({ subjects, quizzes, settings, historyLog }), false);
        setSaveStatus("saved");
        setLastSavedAt(new Date());
      } catch (e) {
        console.error("Save failed", e);
        setSaveStatus("error");
        showToast("Couldn't save — your browser storage may be full or blocked");
      }
    }, 300);
    return () => clearTimeout(saveTimer.current);
  }, [subjects, quizzes, settings, historyLog, loaded]);

  // Best-effort synchronous flush so an edit made right before closing the tab isn't lost
  // to the 300ms debounce above.
  useEffect(() => {
    const flush = () => {
      if (!loaded) return;
      try { window.storage.set(STORAGE_KEY, JSON.stringify({ subjects, quizzes, settings, historyLog }), false); } catch (e) {}
    };
    window.addEventListener("beforeunload", flush);
    return () => window.removeEventListener("beforeunload", flush);
  }, [subjects, quizzes, settings, historyLog, loaded]);

  /* ---------- Google Drive sync ----------
     See the DRIVE_* constants and helper functions near the top of this
     file for the API calls themselves; everything here is state wiring. */
  const applyRemoteContent = (parsed) => {
    // Prevents the push effect below from immediately re-uploading the data
    // we just downloaded as if it were a new local edit.
    suppressNextPushRef.current = true;
    setSubjects(Array.isArray(parsed?.subjects) && parsed.subjects.length ? parsed.subjects.map(normalizeSubject) : DEFAULT_SUBJECTS);
    setQuizzes(Array.isArray(parsed?.quizzes) ? parsed.quizzes.map(normalizeQuiz) : []);
    setSettings(normalizeSettings(parsed?.settings));
    setHistoryLog(Array.isArray(parsed?.historyLog) ? parsed.historyLog.map(normalizeHistoryEntry) : []);
  };

  const connectDrive = async (interactive = true) => {
    if (!driveIsConfigured()) {
      if (interactive) showToast("Google Drive isn't set up yet — set DRIVE_CLIENT_ID near the top of the script to your OAuth Client ID.");
      return;
    }
    if (driveConnectingRef.current) return;
    driveConnectingRef.current = true;
    setDriveStatus("connecting");
    setDriveError(null);
    try {
      await driveWaitForGis();
      let token;
      try {
        token = await driveRequestToken(interactive);
      } catch (e) {
        if (!interactive) { setDriveStatus("disconnected"); return; } // silent reconnect just didn't work; stay disconnected quietly
        throw e;
      }
      driveTokenRef.current = token;
      const email = await driveFetchEmail(token);
      const admin = driveIsAdminEmail(email);
      setDriveEmail(email);
      setDriveIsAdmin(admin);
      if (!ADMIN_EMAILS.length) {
        setShowDriveAdminWarning(true);
        console.warn("ADMIN_EMAILS is empty: Drive sync role-checking is OFF, so every connected account has full write access.");
      }

      let file = DRIVE_SHARED_FILE_ID ? await driveGetFileById(token, DRIVE_SHARED_FILE_ID) : await driveFindFile(token);
      if (!file) {
        if (!admin) throw new Error("No shared quiz file exists yet, and this account isn't an admin. Ask an admin to connect first.");
        file = await driveCreateFile(token, { subjects, quizzes, settings, historyLog, syncedAt: new Date().toISOString() });
        console.info(`Drive file created. Paste this into DRIVE_SHARED_FILE_ID for deterministic lookups: ${file.id}`);
        showToast(`Created the shared Drive file — copy its ID into DRIVE_SHARED_FILE_ID (see console)`);
      } else {
        const remote = await driveDownloadFile(token, file.id);
        applyRemoteContent(remote);
      }
      setDriveFileId(file.id);
      driveModifiedTimeRef.current = file.modifiedTime;
      setDriveStatus("connected");
      setDriveSyncStatus("synced");
      localStorage.setItem(DRIVE_TOKEN_LS_KEY, "true");
      showToast(`Connected to Drive as ${email || "your Google account"}${admin ? "" : " (read-only)"}`);
    } catch (e) {
      console.error("Drive connect failed", e);
      setDriveStatus("error");
      setDriveError(e.message || "Couldn't connect to Google Drive");
      showToast(e.message || "Couldn't connect to Google Drive");
    } finally {
      driveConnectingRef.current = false;
    }
  };

  const disconnectDrive = async () => {
    await driveRevokeToken(driveTokenRef.current);
    driveTokenRef.current = null;
    driveModifiedTimeRef.current = null;
    setDriveStatus("disconnected");
    setDriveEmail(null);
    setDriveIsAdmin(false);
    setDriveFileId(null);
    setDriveSyncStatus("idle");
    setDriveConflict(null);
    setShowDriveAdminWarning(false);
    localStorage.removeItem(DRIVE_TOKEN_LS_KEY);
    showToast("Disconnected from Drive");
  };

  const refreshFromDrive = async () => {
    if (driveStatus !== "connected" || !driveFileId || !driveTokenRef.current) return;
    setDriveSyncStatus("syncing");
    try {
      const meta = await driveApiFetchJson(`${DRIVE_API}/${driveFileId}?fields=modifiedTime`, driveTokenRef.current);
      const remote = await driveDownloadFile(driveTokenRef.current, driveFileId);
      applyRemoteContent(remote);
      driveModifiedTimeRef.current = meta?.modifiedTime || driveModifiedTimeRef.current;
      setDriveSyncStatus("synced");
      showToast("Refreshed from Drive");
    } catch (e) {
      console.error("Drive refresh failed", e);
      setDriveSyncStatus("error");
      showToast("Couldn't refresh from Drive");
    }
  };

  const resolveConflictKeepMine = async () => {
    if (!driveConflict) return;
    try {
      setDriveSyncStatus("syncing");
      const newModifiedTime = await driveUpdateFile(
        driveTokenRef.current, driveFileId,
        { subjects, quizzes, settings, historyLog, syncedAt: new Date().toISOString() },
        driveConflict.remoteModifiedTime
      );
      driveModifiedTimeRef.current = newModifiedTime;
      setDriveSyncStatus("synced");
      setDriveConflict(null);
      showToast("Kept your version and overwrote the shared file");
    } catch (e) {
      showToast("Still conflicting — try \"Load their version\" instead");
    }
  };

  const resolveConflictLoadTheirs = () => {
    if (!driveConflict || !driveConflict.remoteContent) { showToast("Couldn't load the shared version"); return; }
    applyRemoteContent(driveConflict.remoteContent);
    driveModifiedTimeRef.current = driveConflict.remoteModifiedTime;
    setDriveSyncStatus("synced");
    setDriveConflict(null);
    showToast("Loaded the shared file's latest version");
  };

  // Debounced push, admins only, with an optimistic-concurrency conflict guard
  // (see driveUpdateFile). Viewers never write, so this effect no-ops for them.
  useEffect(() => {
    if (!loaded || driveStatus !== "connected" || !driveIsAdmin || !driveFileId) return;
    if (suppressNextPushRef.current) { suppressNextPushRef.current = false; return; }
    if (drivePushTimer.current) clearTimeout(drivePushTimer.current);
    drivePushTimer.current = setTimeout(async () => {
      setDriveSyncStatus("syncing");
      try {
        const newModifiedTime = await driveUpdateFile(
          driveTokenRef.current, driveFileId,
          { subjects, quizzes, settings, historyLog, syncedAt: new Date().toISOString() },
          driveModifiedTimeRef.current
        );
        driveModifiedTimeRef.current = newModifiedTime;
        setDriveSyncStatus("synced");
      } catch (e) {
        if (e.isConflict) {
          setDriveSyncStatus("conflict");
          try {
            const remoteContent = await driveDownloadFile(driveTokenRef.current, driveFileId);
            setDriveConflict({ remoteContent, remoteModifiedTime: e.remoteModifiedTime });
          } catch (e2) {
            setDriveConflict({ remoteContent: null, remoteModifiedTime: e.remoteModifiedTime });
          }
        } else {
          console.error("Drive push failed", e);
          setDriveSyncStatus("error");
          showToast("Couldn't sync to Drive — will retry on your next change");
        }
      }
    }, 2500);
    return () => clearTimeout(drivePushTimer.current);
  }, [subjects, quizzes, settings, historyLog, loaded, driveStatus, driveIsAdmin, driveFileId]);

  // Attempt a silent (no popup) reconnect once local data has loaded, if the
  // user previously connected. Never persists the token itself — only this
  // boolean flag — so a stolen localStorage dump can't be replayed as Drive
  // access; at worst it triggers one harmless silent-auth attempt.
  useEffect(() => {
    if (!loaded) return;
    if (driveIsConfigured() && localStorage.getItem(DRIVE_TOKEN_LS_KEY) === "true") {
      connectDrive(false);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loaded]);

  /* ---------- weekly rollover for routine quizzes ----------
     Once a routine quiz has been completed, it stays checked off until the ISO
     week changes. At that point we archive the completed attempt into
     historyLog (so it's never lost) and reset the quiz back to "not completed"
     with a blank score, ready to be done again this week. Runs on load and
     then re-checks hourly in case the tab is left open across the week
     boundary. */
  const performWeeklyRollover = () => {
    const currentWeek = getISOWeek(new Date());
    setQuizzes((qs) => {
      const rolled = [];
      const next = qs.map((q) => {
        if (q.isRoutine && q.completed && q.completedWeek && q.completedWeek !== currentWeek) {
          rolled.push({
            id: uid("hist"), quizId: q.id, quizName: q.name, subjectId: q.subjectId,
            week: q.completedWeek, date: q.completedAt, trackScore: q.trackScore,
            totalItems: q.totalItems, correctItems: q.correctItems, score: q.score, link: q.link,
          });
          return { ...q, completed: false, completedAt: null, completedWeek: null, correctItems: null, score: null };
        }
        return q;
      });
      if (rolled.length) {
        setHistoryLog((h) => [...rolled, ...h]);
        showToastRef.current(`${rolled.length} routine quiz${rolled.length === 1 ? "" : "zes"} reset for the new week`);
        return next;
      }
      return qs;
    });
  };
  useEffect(() => {
    if (!loaded) return;
    performWeeklyRollover();
    const interval = setInterval(performWeeklyRollover, 60 * 60 * 1000);
    return () => clearInterval(interval);
  }, [loaded]);

  const subjectMap = useMemo(() => Object.fromEntries(subjects.map((s) => [s.id, s])), [subjects]);

  // Central write gate: everyone connected to Drive as a non-admin is
  // read-only in this app, no matter what Drive's own sharing permissions
  // would otherwise allow. Every function below that mutates quiz/subject/
  // settings data calls this first.
  const guardReadOnly = () => {
    if (isReadOnly) {
      showToast("You're viewing shared data as a read-only guest — ask an admin for edit access.");
      return true;
    }
    return false;
  };

  const saveQuiz = (data) => {
    if (guardReadOnly()) return;
    setQuizzes((qs) => {
      let scheduledDay = data.isRoutine ? (data.scheduledDay || null) : null;
      if (data.isRoutine && !scheduledDay) {
        const pool = data.id ? qs.filter((q) => q.id !== data.id) : qs;
        scheduledDay = leastBusyDay(pool);
      }
      if (data.id) {
        return qs.map((q) => {
          if (q.id !== data.id) return q;
          let completionFields = {};
          if (data.completed && !q.completed) {
            completionFields = { completedAt: new Date().toISOString().slice(0, 10), completedWeek: getISOWeek(new Date()) };
          } else if (!data.completed && q.completed) {
            completionFields = { completedAt: null, completedWeek: null };
          }
          return { ...q, ...data, scheduledDay, ...completionFields };
        });
      }
      const completionFields = data.completed ? { completedAt: new Date().toISOString().slice(0, 10), completedWeek: getISOWeek(new Date()) } : {};
      return [...qs, { ...data, id: uid("q"), scheduledDay, ...completionFields }];
    });
    showToast(data.id ? "Quiz updated" : "Quiz added");
    setShowModal(false);
    setEditingQuiz(null);
  };

  const deleteQuiz = (id) => {
    if (guardReadOnly()) return;
    const target = quizzes.find((q) => q.id === id);
    if (!window.confirm(`Delete "${target?.name || "this quiz"}"? This can't be undone.`)) return;
    setQuizzes((qs) => qs.filter((q) => q.id !== id));
    showToast("Quiz deleted");
  };
  const duplicateQuiz = (id) => {
    if (guardReadOnly()) return;
    const target = quizzes.find((q) => q.id === id);
    if (!target) return;
    const newName = getNextDuplicateName(target.name, quizzes.map((q) => q.name));
    const copy = {
      ...target,
      id: uid("q"),
      name: newName,
      completed: false,
      completedAt: null,
      completedWeek: null,
      correctItems: null,
      score: null,
    };
    setQuizzes((qs) => [...qs, copy]);
    showToast(`Quiz duplicated as "${newName}"`);
  };
  const toggleComplete = (id) => {
    if (guardReadOnly()) return;
    setQuizzes((qs) => qs.map((q) => {
      if (q.id !== id) return q;
      const turningOn = !q.completed;
      if (turningOn) {
        return { ...q, completed: true, completedAt: new Date().toISOString().slice(0, 10), completedWeek: getISOWeek(new Date()) };
      }
      return { ...q, completed: false, completedAt: null, completedWeek: null };
    }));
  };
  const toggleRoutine = (id) => {
    if (guardReadOnly()) return;
    setQuizzes((qs) => {
      const target = qs.find((q) => q.id === id);
      if (!target) return qs;
      const turningOn = !target.isRoutine;
      const scheduledDay = turningOn ? leastBusyDay(qs) : null;
      return qs.map((q) => (q.id === id ? { ...q, isRoutine: turningOn, scheduledDay } : q));
    });
  };
  const updatePercentScore = (id, value) => {
    if (guardReadOnly()) return;
    let v = value === "" ? null : Math.max(0, Math.min(100, Number(value)));
    setQuizzes((qs) => qs.map((q) => (q.id === id ? { ...q, score: v } : q)));
  };
  const updateCorrectItems = (id, value, totalItems) => {
    if (guardReadOnly()) return;
    if (value === "") { setQuizzes((qs) => qs.map((q) => (q.id === id ? { ...q, correctItems: null } : q))); return; }
    const max = typeof totalItems === "number" ? totalItems : 999999;
    const v = Math.max(0, Math.min(max, Number(value)));
    setQuizzes((qs) => qs.map((q) => (q.id === id ? { ...q, correctItems: v } : q)));
  };
  const shuffleSchedule = () => {
    if (guardReadOnly()) return;
    setQuizzes((qs) => {
      const routine = qs.filter((q) => q.isRoutine);
      const rest = qs.filter((q) => !q.isRoutine);
      const shuffled = shuffleArray(routine);
      const reassigned = shuffled.map((q, i) => ({ ...q, scheduledDay: WEEKDAYS[i % 7] }));
      return [...rest, ...reassigned];
    });
    showToast("Weekly schedule reshuffled");
  };
  const addSubject = (name, icon, color, soft) => {
    if (guardReadOnly()) return;
    setSubjects((s) => [...s, { id: uid("sub"), name, icon, color, soft, passThreshold: null }]);
  };
  const deleteSubject = (id) => {
    if (guardReadOnly()) return;
    if (quizzes.some((q) => q.subjectId === id)) { showToast("Reassign or remove quizzes using this subject first"); return; }
    const target = subjects.find((s) => s.id === id);
    if (!window.confirm(`Delete the subject "${target?.name || "this subject"}"?`)) return;
    setSubjects((s) => s.filter((x) => x.id !== id));
  };
  const updateSubjectThreshold = (id, value) => {
    if (guardReadOnly()) return;
    const v = value === "" ? null : Math.max(0, Math.min(100, Number(value)));
    setSubjects((s) => s.map((x) => (x.id === id ? { ...x, passThreshold: v } : x)));
  };
  const updateGlobalThreshold = (value) => {
    if (guardReadOnly()) return;
    const v = Math.max(0, Math.min(100, Number(value) || 0));
    setSettings((s) => ({ ...s, passingThreshold: v }));
  };
  // Switching sort field (via the dropdown, or clicking a column header
  // that isn't already active) resets direction to that field's default.
  const handleSortByChange = (field) => {
    setSortBy(field);
    setSortDir(SORT_FIELDS[field]?.defaultDir || "asc");
  };
  // Clicking the already-active column header just flips direction.
  const handleHeaderSort = (field) => {
    if (sortBy === field) setSortDir((d) => (d === "asc" ? "desc" : "asc"));
    else handleSortByChange(field);
  };
  const toggleSortDir = () => setSortDir((d) => (d === "asc" ? "desc" : "asc"));

  const toggleColumn = (key) => {
    setSettings((s) => ({ ...s, visibleColumns: { ...s.visibleColumns, [key]: !s.visibleColumns[key] } }));
  };

  const handleExport = () => {
    try {
      const data = JSON.stringify({ subjects, quizzes, settings, historyLog, exportedAt: new Date().toISOString() }, null, 2);
      const blob = new Blob([data], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `spanish-quiz-tracker-backup-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast("Backup exported");
    } catch (e) {
      showToast("Export failed");
    }
  };

  const handleImportClick = () => fileInputRef.current?.click();

  const handleImportFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (guardReadOnly()) { e.target.value = ""; return; }
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      if (!parsed || !Array.isArray(parsed.subjects) || !Array.isArray(parsed.quizzes)) {
        throw new Error("Unexpected file shape");
      }
      if (!window.confirm("Importing will replace all current quizzes and subjects. Continue?")) return;
      setSubjects(parsed.subjects.length ? parsed.subjects.map(normalizeSubject) : DEFAULT_SUBJECTS);
      setQuizzes(parsed.quizzes.map(normalizeQuiz));
      setSettings(normalizeSettings(parsed.settings));
      setHistoryLog(Array.isArray(parsed.historyLog) ? parsed.historyLog.map(normalizeHistoryEntry) : []);
      showToast("Backup imported");
    } catch (err) {
      showToast("Import failed — that file isn't a valid backup");
    } finally {
      e.target.value = "";
    }
  };

  const todayISO = useMemo(() => new Date().toISOString().slice(0, 10), []);
  const subjectStats = useMemo(() => getSubjectStats(quizzes, settings, subjectMap), [quizzes, settings, subjectMap]);
  const weakestSubject = useMemo(() => getWeakestSubject(subjectStats, subjectMap), [subjectStats, subjectMap]);

  const filtered = useMemo(() => {
    let list = [...quizzes];
    if (filterSubject !== "all") list = list.filter((q) => q.subjectId === filterSubject);
    if (filterStatus !== "all") list = list.filter((q) => getQuizStatus(q, subjectMap[q.subjectId], settings, todayISO) === filterStatus);
    if (filterRoutine === "routine") list = list.filter((q) => q.isRoutine);
    if (filterRoutine === "one-off") list = list.filter((q) => !q.isRoutine);
    const term = searchTerm.trim().toLowerCase();
    if (term) list = list.filter((q) => q.name.toLowerCase().includes(term) || (q.description || "").toLowerCase().includes(term));
    return sortQuizzes(list, sortBy, sortDir, { subjectMap, settings, subjectStats, todayISO });
  }, [quizzes, filterSubject, filterStatus, filterRoutine, sortBy, sortDir, subjectMap, searchTerm, settings, todayISO, subjectStats]);

  const activeQuizzes = useMemo(() => filtered.filter((q) => !q.completed), [filtered]);
  const completedQuizzes = useMemo(() => filtered.filter((q) => q.completed), [filtered]);

  const stats = useMemo(() => {
    const total = quizzes.length;
    const completed = quizzes.filter((q) => q.completed).length;
    const pct = total ? Math.round((completed / total) * 100) : 0;
    const routineCount = quizzes.filter((q) => q.isRoutine).length;
    return { total, completed, pct, routineCount };
  }, [quizzes]);

  const recommendation = useMemo(() => getRecommendation(quizzes, subjectMap, settings), [quizzes, subjectMap, settings]);
  const counts = useMemo(() => dayCounts(quizzes), [quizzes]);

  const activeFilterCount = [filterSubject !== "all", filterStatus !== "all", filterRoutine !== "all"].filter(Boolean).length;
  const resetFilters = () => { setFilterSubject("all"); setFilterStatus("all"); setFilterRoutine("all"); setSortBy("priority"); setSortDir(SORT_FIELDS.priority.defaultDir); };
  const anyMenuOpen = showFilters || showMoreMenu;
  const closeMenus = () => { setShowFilters(false); setShowMoreMenu(false); };

  if (!loaded) {
    return <div className="qt-root qt-loading"><div className="qt-spinner" /></div>;
  }

  return (
    <div className="qt-root">
      <header className="qt-header">
        <div className="qt-header-top">
          <div className="qt-eyebrow-row">
            <div className="qt-eyebrow">CUADERNO DE PROGRESO</div>
            <div className="qt-status-group">
              <SaveStatus status={saveStatus} lastSavedAt={lastSavedAt} />
              <DriveStatusBadge status={driveStatus} syncStatus={driveSyncStatus} isAdmin={driveIsAdmin} />
            </div>
          </div>
          <h1 className="qt-title">Spanish Quiz Tracker</h1>
          <p className="qt-subtitle">Every lesson, exam, and routine drill in one notebook — scheduled, scored, and self-grading your readiness.</p>
        </div>
        {isReadOnly && (
          <div className="qt-banner qt-banner-info" role="status">
            <Icon name="cloud" size={14}/>
            <span>You're viewing <strong>{driveEmail}</strong>'s shared quiz library as a read-only guest. Changes you make here won't be saved.</span>
            <button type="button" className="qt-btn qt-btn-ghost qt-banner-action" onClick={refreshFromDrive}>Refresh</button>
          </div>
        )}
        {showDriveAdminWarning && driveStatus === "connected" && (
          <div className="qt-banner qt-banner-warning" role="alert">
            <Icon name="alertCircle" size={14}/>
            <span><strong>ADMIN_EMAILS is empty</strong> — role-checking is off, so every Google account that connects has full read/write access to this shared file. Set ADMIN_EMAILS in the code to restrict editing.</span>
            <button type="button" className="qt-icon-btn" onClick={() => setShowDriveAdminWarning(false)} aria-label="Dismiss warning"><Icon name="x" size={13}/></button>
          </div>
        )}
        <div className="qt-overview">
          <div className="qt-overview-primary">
            <div className="qt-mini-stats">
              <div className="qt-mini-stat">
                <div className="qt-mini-stat-icon"><Icon name="book" size={14}/></div>
                <div><div className="qt-mini-stat-value">{stats.total}</div><div className="qt-mini-stat-label">Logged</div></div>
              </div>
              <div className="qt-mini-divider" />
              <div className="qt-mini-stat">
                <div className="qt-mini-stat-icon"><Icon name="check" size={14}/></div>
                <div><div className="qt-mini-stat-value">{stats.completed}/{stats.total}</div><div className="qt-mini-stat-label">Completed</div></div>
              </div>
              <div className="qt-mini-divider" />
              <div className="qt-mini-stat">
                <div className="qt-mini-stat-icon"><Icon name="repeat" size={14}/></div>
                <div><div className="qt-mini-stat-value">{stats.routineCount}</div><div className="qt-mini-stat-label">On routine</div></div>
              </div>
            </div>
            <ProgressGauge pct={stats.pct} />
          </div>
          <div className="qt-overview-insights">
            <FocusCard weakest={weakestSubject} />
            <RecommendationStamp rec={recommendation} />
          </div>
        </div>
      </header>

      <div className="qt-toolbar">
        {anyMenuOpen && <div className="qt-menu-backdrop" onClick={closeMenus} />}
        <div className="qt-view-toggle">
          <button className={`qt-toggle-btn ${view === "table" ? "active" : ""}`} onClick={() => setView("table")}><Icon name="table" size={15}/> Table</button>
          <button className={`qt-toggle-btn ${view === "week" ? "active" : ""}`} onClick={() => setView("week")}><Icon name="calendar" size={15}/> This Week</button>
          <button className={`qt-toggle-btn ${view === "month" ? "active" : ""}`} onClick={() => setView("month")}><Icon name="calendarDays" size={15}/> This Month</button>
          <button className={`qt-toggle-btn ${view === "charts" ? "active" : ""}`} onClick={() => setView("charts")}><Icon name="barChart" size={15}/> Charts</button>
          <button className={`qt-toggle-btn ${view === "history" ? "active" : ""}`} onClick={() => setView("history")}><Icon name="history" size={15}/> History</button>
        </div>

        <div className="qt-toolbar-actions">
          <div className="qt-search-wrap">
            <span className="qt-select-icon"><Icon name="search" size={13}/></span>
            <input
              className="qt-search-input"
              type="text"
              value={searchTerm}
              onChange={(e) => setSearchTerm(e.target.value)}
              placeholder="Search quizzes…"
              aria-label="Search quizzes by name"
            />
            {searchTerm && (
              <button className="qt-search-clear" onClick={() => setSearchTerm("")} aria-label="Clear search">
                <Icon name="x" size={12}/>
              </button>
            )}
          </div>

          <div className="qt-filter-wrap">
            <button
              className={`qt-btn qt-btn-ghost ${activeFilterCount ? "has-active" : ""}`}
              onClick={() => { setShowFilters((v) => !v); setShowMoreMenu(false); }}
              aria-expanded={showFilters}
            >
              <Icon name="sliders" size={15}/> Filters
              {activeFilterCount > 0 && <span className="qt-filter-count">{activeFilterCount}</span>}
            </button>
            {showFilters && (
              <div className="qt-filters-panel" role="menu">
                <div className="qt-filters-panel-head">
                  <span>Filter &amp; sort</span>
                  <button type="button" className="qt-icon-btn" onClick={() => setShowFilters(false)} aria-label="Close filters"><Icon name="x" size={13}/></button>
                </div>
                <label className="qt-panel-field"><span>Subject</span>
                  <FilterSelect value={filterSubject} onChange={setFilterSubject} ariaLabel="Filter by subject"
                    options={[{ value: "all", label: "All subjects" }, ...subjects.map((s) => ({ value: s.id, label: `${s.icon} ${s.name}` }))]} />
                </label>
                <label className="qt-panel-field"><span>Status</span>
                  <FilterSelect value={filterStatus} onChange={setFilterStatus} ariaLabel="Filter by status"
                    options={[
                      { value: "all", label: "Any status" },
                      { value: "incomplete", label: "Incomplete" },
                      { value: "overdue", label: "Overdue" },
                      { value: "passed", label: "Passed" },
                      { value: "failed", label: "Failed" },
                      { value: "completed", label: "Done (ungraded)" },
                    ]} />
                </label>
                <label className="qt-panel-field"><span>Type</span>
                  <FilterSelect value={filterRoutine} onChange={setFilterRoutine} ariaLabel="Filter by routine type"
                    options={[{ value: "all", label: "Routine + one-off" }, { value: "routine", label: "Routine only" }, { value: "one-off", label: "One-off only" }]} />
                </label>
                <label className="qt-panel-field"><span>Sort by</span>
                  <div className="qt-sort-field-row">
                    <FilterSelect value={sortBy} onChange={handleSortByChange} ariaLabel="Sort quizzes"
                      options={[{ value: "priority", label: "Priority (weak areas)" }, { value: "name", label: "Name" }, { value: "subject", label: "Subject" }, { value: "dueDate", label: "Due date" }, { value: "routine", label: "Routine" }, { value: "score", label: "Score" }, { value: "status", label: "Status" }]} />
                    <button
                      type="button"
                      className="qt-icon-btn qt-sort-dir-btn"
                      onClick={toggleSortDir}
                      aria-label={sortDir === "asc" ? "Currently sorting ascending. Switch to descending." : "Currently sorting descending. Switch to ascending."}
                      title={sortDir === "asc" ? "Ascending" : "Descending"}
                    >
                      <Icon name={sortDir === "asc" ? "arrowUp" : "arrowDown"} size={14}/>
                    </button>
                  </div>
                </label>
                {activeFilterCount > 0 && (
                  <button type="button" className="qt-btn qt-btn-ghost qt-filters-reset" onClick={resetFilters}><Icon name="x" size={13}/> Reset filters</button>
                )}
              </div>
            )}
          </div>

          <div className="qt-more-wrap">
            <button className="qt-icon-btn qt-more-btn" onClick={() => { setShowMoreMenu((v) => !v); setShowFilters(false); }} aria-label="More actions" aria-expanded={showMoreMenu}>
              <Icon name="more" size={17}/>
            </button>
            {showMoreMenu && (
              <div className="qt-more-menu" role="menu">
                {view === "table" && (
                  <>
                    <div className="qt-more-menu-label">Show columns</div>
                    {[
                      { key: "subject", label: "Subject" },
                      { key: "dueDate", label: "Due date" },
                      { key: "routine", label: "Routine" },
                      { key: "score", label: "Score / Grade" },
                      { key: "status", label: "Status" },
                    ].map((o) => (
                      <label key={o.key} className="qt-checkline qt-more-menu-check">
                        <input type="checkbox" checked={!!settings.visibleColumns[o.key]} onChange={() => toggleColumn(o.key)} /> <span>{o.label}</span>
                      </label>
                    ))}
                    <div className="qt-more-menu-divider" />
                  </>
                )}
                {view === "week" && (
                  <button type="button" className="qt-more-menu-item" onClick={() => { shuffleSchedule(); setShowMoreMenu(false); }}>
                    <Icon name="shuffle" size={15}/> Reshuffle schedule
                  </button>
                )}
                <button type="button" className="qt-more-menu-item" onClick={() => { setShowSettings(true); setShowMoreMenu(false); }}>
                  <Icon name="settings" size={15}/> Settings
                </button>
                <div className="qt-more-menu-divider" />
                <button type="button" className="qt-more-menu-item" onClick={() => { handleExport(); setShowMoreMenu(false); }} title="Download a backup of all your data">
                  <Icon name="download" size={15}/> Export backup
                </button>
                <button type="button" className="qt-more-menu-item" disabled={isReadOnly} onClick={() => { handleImportClick(); setShowMoreMenu(false); }} title={isReadOnly ? "Read-only guests can't import" : "Restore data from a backup file"}>
                  <Icon name="upload" size={15}/> Import backup
                </button>
                <div className="qt-more-menu-divider" />
                {driveStatus === "connected" ? (
                  <>
                    <div className="qt-more-menu-label">
                      Drive: {driveEmail} {driveIsAdmin ? "(admin)" : "(read-only)"}
                    </div>
                    <button type="button" className="qt-more-menu-item" onClick={() => { refreshFromDrive(); setShowMoreMenu(false); }}>
                      <Icon name="cloud" size={15}/> Refresh from Drive
                    </button>
                    <button type="button" className="qt-more-menu-item" onClick={() => { disconnectDrive(); setShowMoreMenu(false); }}>
                      <Icon name="x" size={15}/> Disconnect Drive
                    </button>
                  </>
                ) : (
                  <button type="button" className="qt-more-menu-item" onClick={() => { connectDrive(true); setShowMoreMenu(false); }} disabled={driveStatus === "connecting"}>
                    <Icon name="cloud" size={15}/> {driveStatus === "connecting" ? "Connecting…" : "Connect Google Drive"}
                  </button>
                )}
              </div>
            )}
            <input ref={fileInputRef} type="file" accept="application/json" style={{ display: "none" }} onChange={handleImportFile} />
          </div>

          <button className="qt-btn qt-btn-primary qt-new-quiz-btn" disabled={isReadOnly} title={isReadOnly ? "Read-only guests can't add quizzes" : undefined} onClick={() => { if (guardReadOnly()) return; setEditingQuiz(null); setShowModal(true); }}><Icon name="plus" size={15}/> New quiz</button>
        </div>
      </div>

      <button className="qt-fab" disabled={isReadOnly} onClick={() => { if (guardReadOnly()) return; setEditingQuiz(null); setShowModal(true); }} aria-label="Add new quiz">
        <Icon name="plus" size={22}/>
      </button>

      {view === "table" && (
        <>
          <QuizTable quizzes={activeQuizzes} subjectMap={subjectMap} settings={settings} todayISO={todayISO} visibleColumns={settings.visibleColumns} subjectStats={subjectStats}
            sortBy={sortBy} sortDir={sortDir} onSort={handleHeaderSort}
            onToggleComplete={toggleComplete} onToggleRoutine={toggleRoutine}
            onUpdatePercentScore={updatePercentScore} onUpdateCorrectItems={updateCorrectItems}
            onEdit={(q) => { setEditingQuiz(q); setShowModal(true); }} onDelete={deleteQuiz} onDuplicate={duplicateQuiz}
            emptyMessage={filtered.length === 0 ? "No quizzes match these filters yet. Add one, or widen your filters." : "Nothing left to do here — nice work!"} />

          {completedQuizzes.length > 0 && (
            <div className="qt-completed-section">
              <button type="button" className="qt-completed-toggle" onClick={() => setCompletedExpanded((v) => !v)} aria-expanded={completedExpanded}>
                <Icon name="chevronDown" size={14} style={{ transform: completedExpanded ? "rotate(0deg)" : "rotate(-90deg)", transition: "transform .15s ease" }} />
                <span>Completed</span>
                <span className="qt-completed-count">{completedQuizzes.length}</span>
                <span className="qt-completed-hint">{completedExpanded ? "Hide" : "Show"}</span>
              </button>
              {completedExpanded && (
                <QuizTable quizzes={completedQuizzes} subjectMap={subjectMap} settings={settings} todayISO={todayISO} visibleColumns={settings.visibleColumns} subjectStats={subjectStats}
                  sortBy={sortBy} sortDir={sortDir} onSort={handleHeaderSort}
                  onToggleComplete={toggleComplete} onToggleRoutine={toggleRoutine}
                  onUpdatePercentScore={updatePercentScore} onUpdateCorrectItems={updateCorrectItems}
                  onEdit={(q) => { setEditingQuiz(q); setShowModal(true); }} onDelete={deleteQuiz} onDuplicate={duplicateQuiz} />
              )}
            </div>
          )}
        </>
      )}
      {view === "week" && (
        <WeekView quizzes={quizzes} subjectMap={subjectMap} counts={counts} onToggleComplete={toggleComplete} />
      )}
      {view === "month" && (
        <MonthView quizzes={quizzes} subjectMap={subjectMap} settings={settings} todayISO={todayISO}
          onToggleComplete={toggleComplete} onEdit={(q) => { setEditingQuiz(q); setShowModal(true); }} />
      )}
      {view === "charts" && (
        <ChartsView quizzes={quizzes} historyLog={historyLog} subjects={subjects} subjectMap={subjectMap} settings={settings} subjectStats={subjectStats} />
      )}
      {view === "history" && (
        <HistoryView historyLog={historyLog} quizzes={quizzes} subjectMap={subjectMap} settings={settings} />
      )}

      {showModal && (
        <QuizModal subjects={subjects} settings={settings} initial={editingQuiz}
          onClose={() => { setShowModal(false); setEditingQuiz(null); }} onSave={saveQuiz} />
      )}
      {showSettings && (
        <SettingsModal subjects={subjects} settings={settings}
          onAddSubject={addSubject} onDeleteSubject={deleteSubject} onSubjectThreshold={updateSubjectThreshold}
          onGlobalThreshold={updateGlobalThreshold} onClose={() => setShowSettings(false)} />
      )}
      {driveConflict && (
        <DriveConflictModal
          hasRemote={!!driveConflict.remoteContent}
          onKeepMine={resolveConflictKeepMine}
          onLoadTheirs={resolveConflictLoadTheirs}
        />
      )}
      {toast && <div className="qt-toast">{toast}</div>}
    </div>
  );
}

function DriveStatusBadge({ status, syncStatus, isAdmin }) {
  if (status !== "connected") return null;
  let label = "Drive synced";
  let icon = "cloud";
  let cls = "qt-drive-synced";
  if (syncStatus === "syncing") { label = "Syncing…"; cls = "qt-drive-syncing"; }
  else if (syncStatus === "conflict") { label = "Sync conflict"; cls = "qt-drive-conflict"; icon = "alertCircle"; }
  else if (syncStatus === "error") { label = "Sync error"; cls = "qt-drive-error"; icon = "alertCircle"; }
  else if (!isAdmin) { label = "Drive (read-only)"; }
  return (
    <span className={`qt-save-status ${cls}`}>
      <Icon name={icon} size={11}/> {label}
    </span>
  );
}

function DriveConflictModal({ hasRemote, onKeepMine, onLoadTheirs }) {
  return (
    <div className="qt-modal-overlay">
      <div className="qt-modal" role="alertdialog" aria-modal="true" aria-label="Drive sync conflict">
        <div className="qt-modal-head"><h2>Sync conflict</h2></div>
        <div className="qt-settings-section">
          <p className="qt-settings-helper">
            Someone else saved changes to the shared Drive file since your last sync. Choose how to resolve it —
            we won't overwrite either version automatically.
          </p>
          <div className="qt-conflict-actions">
            <button type="button" className="qt-btn qt-btn-primary" onClick={onKeepMine}>Keep my version (overwrite shared file)</button>
            <button type="button" className="qt-btn qt-btn-ghost" onClick={onLoadTheirs} disabled={!hasRemote}>Load their version (discard my local changes)</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function SaveStatus({ status, lastSavedAt }) {
  const timeStr = lastSavedAt ? lastSavedAt.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "";
  let label = "";
  if (status === "saving") label = "Saving…";
  else if (status === "saved") label = `Saved ${timeStr}`;
  else if (status === "error") label = "Save failed";
  else return null;
  return (
    <span className={`qt-save-status qt-save-${status}`}>
      <Icon name="cloud" size={12}/> {label}
    </span>
  );
}

function ProgressGauge({ pct }) {
  const r = 26, c = 2 * Math.PI * r, offset = c - (pct / 100) * c;
  return (
    <div className="qt-gauge-card">
      <svg width="64" height="64" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r={r} fill="none" stroke="var(--line)" strokeWidth="6" />
        <circle cx="32" cy="32" r={r} fill="none" stroke="var(--teal)" strokeWidth="6" strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round" transform="rotate(-90 32 32)" style={{ transition: "stroke-dashoffset .5s ease" }} />
        <text x="32" y="37" textAnchor="middle" fontSize="15" fontFamily="IBM Plex Mono, monospace" fontWeight="600" fill="var(--ink)">{pct}%</text>
      </svg>
      <div className="qt-gauge-label">Overall<br />progress</div>
    </div>
  );
}

function RecommendationStamp({ rec }) {
  const tierMeta = {
    insufficient: { text: "IN PROGRESS", color: "var(--ink-soft)" },
    practice: { text: "KEEP PRACTICING", color: "var(--rose)" },
    close: { text: "ALMOST READY", color: "var(--gold)" },
    ready: { text: "LEVEL UP READY", color: "var(--teal)" },
  }[rec.tier];
  return (
    <div className="qt-rec-card">
      <div className="qt-stamp" style={{ borderColor: tierMeta.color, color: tierMeta.color }}>{tierMeta.text}</div>
      <p className="qt-rec-detail">{rec.detail}</p>
    </div>
  );
}

function FocusCard({ weakest }) {
  if (!weakest) {
    return (
      <div className="qt-focus-card qt-focus-empty">
        <div className="qt-focus-icon"><Icon name="flame" size={15}/></div>
        <div>
          <div className="qt-focus-title">Focus area</div>
          <div className="qt-focus-detail">Grade a few more quizzes per subject to see where to focus.</div>
        </div>
      </div>
    );
  }
  const pct = Math.round(weakest.passRate * 100);
  return (
    <div className="qt-focus-card">
      <div className="qt-focus-icon" style={{ color: weakest.subject?.color, background: weakest.subject?.soft }}><Icon name="flame" size={15}/></div>
      <div>
        <div className="qt-focus-title">Focus area: {weakest.subject?.icon} {weakest.subject?.name || "Unassigned"}</div>
        <div className="qt-focus-detail">Passing {pct}% of {weakest.attempts} graded {weakest.attempts === 1 ? "attempt" : "attempts"} — the quizzes you fail most often are pinned to the top of the table.</div>
      </div>
    </div>
  );
}

function FilterSelect({ iconName, value, onChange, options, ariaLabel }) {
  return (
    <div className="qt-select-wrap">
      {iconName && <span className="qt-select-icon"><Icon name={iconName} size={13}/></span>}
      <select className="qt-select" style={iconName ? { paddingLeft: 26 } : {}} value={value} onChange={(e) => onChange(e.target.value)} aria-label={ariaLabel}>
        {options.map((o) => (<option key={o.value} value={o.value}>{o.label}</option>))}
      </select>
      <Icon name="chevronDown" size={13} className="qt-select-chevron" />
    </div>
  );
}

function GradeBadge({ grade }) {
  if (!grade) return null;
  return (
    <span className={`qt-grade-badge ${grade.pass ? "is-pass" : "is-fail"}`}>
      {grade.percent}% {grade.pass ? "· Pass" : "· Fail"}
    </span>
  );
}

function StatusPill({ status }) {
  const meta = STATUS_META[status];
  return <span className="qt-status-pill" style={{ color: meta.color, background: meta.soft }}>{meta.label}</span>;
}

function ScoreCell({ quiz, subject, settings, onUpdateCorrectItems, onUpdatePercentScore }) {
  if (!quiz.trackScore) return <span className="qt-mono qt-muted">—</span>;
  const usingItems = typeof quiz.totalItems === "number";
  const grade = getGrade(quiz, subject, settings);
  const accent = subject?.color || "var(--teal)";

  const stepItems = (delta) => {
    const current = typeof quiz.correctItems === "number" ? quiz.correctItems : 0;
    const next = Math.max(0, Math.min(quiz.totalItems, current + delta));
    onUpdateCorrectItems(quiz.id, String(next), quiz.totalItems);
  };
  const stepPercent = (delta) => {
    const current = typeof quiz.score === "number" ? quiz.score : 0;
    const next = Math.max(0, Math.min(100, current + delta));
    onUpdatePercentScore(quiz.id, String(next));
  };

  return (
    <div className="qt-score-cell">
      {usingItems ? (
        <span className="qt-score-fraction">
          <span className="qt-score-stepper" style={{ "--accent": accent }}>
            <button type="button" className="qt-score-step-btn" onClick={() => stepItems(-1)} aria-label="Decrease correct answers by 1"><Icon name="minus" size={11}/></button>
            <input type="number" min="0" max={quiz.totalItems} placeholder="—" className="qt-score-input qt-score-input-sm"
              value={quiz.correctItems ?? ""} onChange={(e) => onUpdateCorrectItems(quiz.id, e.target.value, quiz.totalItems)}
              aria-label={`Correct answers for ${quiz.name}, out of ${quiz.totalItems}`} />
            <button type="button" className="qt-score-step-btn" onClick={() => stepItems(1)} aria-label="Increase correct answers by 1"><Icon name="plus" size={11}/></button>
          </span>
          <span className="qt-score-of">/ {quiz.totalItems}</span>
        </span>
      ) : (
        <span className="qt-score-stepper" style={{ "--accent": accent }}>
          <button type="button" className="qt-score-step-btn" onClick={() => stepPercent(-1)} aria-label="Decrease score by 1"><Icon name="minus" size={11}/></button>
          <input type="number" min="0" max="100" placeholder="—" className="qt-score-input"
            value={quiz.score ?? ""} onChange={(e) => onUpdatePercentScore(quiz.id, e.target.value)}
            aria-label={`Score for ${quiz.name}`} />
          <button type="button" className="qt-score-step-btn" onClick={() => stepPercent(1)} aria-label="Increase score by 1"><Icon name="plus" size={11}/></button>
        </span>
      )}
      <GradeBadge grade={grade} />
    </div>
  );
}

/* Clickable, keyboard-accessible column header. Uses a native <button> inside
   the <th> (rather than an onClick on the <th> itself) so it's reachable by
   Tab and activatable with Enter/Space without extra role/tabIndex plumbing,
   and exposes standard aria-sort so assistive tech announces sort state. */
function SortableHeader({ field, label, sortBy, sortDir, onSort, style }) {
  const isActive = sortBy === field;
  const ariaSort = isActive ? (sortDir === "asc" ? "ascending" : "descending") : "none";
  return (
    <th style={style} aria-sort={ariaSort}>
      <button type="button" className={`qt-th-sort-btn ${isActive ? "active" : ""}`} onClick={() => onSort && onSort(field)}>
        <span>{label}</span>
        <span className="qt-th-sort-icon" aria-hidden="true">
          {isActive ? <Icon name={sortDir === "asc" ? "arrowUp" : "arrowDown"} size={11}/> : <Icon name="arrowUpDown" size={11}/>}
        </span>
      </button>
    </th>
  );
}

function QuizTable({ quizzes, subjectMap, settings, todayISO, visibleColumns, subjectStats, sortBy, sortDir, onSort, onToggleComplete, onToggleRoutine, onUpdatePercentScore, onUpdateCorrectItems, onEdit, onDelete, onDuplicate, emptyMessage }) {
  if (quizzes.length === 0) return <div className="qt-empty">{emptyMessage || "No quizzes match these filters yet. Add one, or widen your filters."}</div>;
  return (
    <div className="qt-table-wrap">
      <table className="qt-table">
        <thead><tr>
          <th style={{ width: 34 }}></th>
          <SortableHeader field="name" label="Test or Deadline" sortBy={sortBy} sortDir={sortDir} onSort={onSort} />
          {visibleColumns.subject && <SortableHeader field="subject" label="Subject" sortBy={sortBy} sortDir={sortDir} onSort={onSort} />}
          {visibleColumns.dueDate && <SortableHeader field="dueDate" label="Due date" sortBy={sortBy} sortDir={sortDir} onSort={onSort} />}
          {visibleColumns.routine && <SortableHeader field="routine" label="Routine" sortBy={sortBy} sortDir={sortDir} onSort={onSort} />}
          {visibleColumns.score && <SortableHeader field="score" label="Score / Grade" sortBy={sortBy} sortDir={sortDir} onSort={onSort} />}
          {visibleColumns.status && <SortableHeader field="status" label="Status" sortBy={sortBy} sortDir={sortDir} onSort={onSort} />}
          <th style={{ width: 96 }}></th>
        </tr></thead>
        <tbody>
          {quizzes.map((q) => {
            const subj = subjectMap[q.subjectId] || { name: "Unassigned", icon: "•", color: "#999", soft: "#eee" };
            const status = getQuizStatus(q, subj, settings, todayISO);
            const isOverdue = status === "overdue";
            const sStats = (subjectStats && subjectStats[q.subjectId]) || null;
            const isPriority = sStats && sStats.attempts >= 2 && sStats.failRate > 0.3 && status !== "passed" && status !== "completed";
            return (
              <tr key={q.id} className={`${q.completed ? "is-complete" : ""} ${isOverdue ? "is-overdue" : ""}`}>
                <td data-label="">
                  <button
                    className={`qt-checkbox ${q.completed ? "checked" : ""}`}
                    onClick={() => onToggleComplete(q.id)}
                    aria-pressed={q.completed}
                    aria-label={q.completed ? `Mark "${q.name}" as incomplete` : `Mark "${q.name}" as complete`}
                  >{q.completed && <Icon name="check" size={12} strokeWidth={3}/>}</button>
                </td>
                <td>
                  <div className="qt-name-cell">
                    <span className="qt-name" onClick={() => onEdit(q)}>
                      {isPriority && <span className="qt-priority-flag" title={`Frequently missed in ${subj.name} — review this first`}><Icon name="flame" size={11}/></span>}
                      {q.name}
                      {q.link && (
                        <a href={q.link} target="_blank" rel="noreferrer" className="qt-link-icon" onClick={(e) => e.stopPropagation()} aria-label={`Open quiz link for ${q.name}`} title="Open quiz link">
                          <Icon name="link" size={11}/>
                        </a>
                      )}
                    </span>
                    {q.description && <span className="qt-desc-tag" onClick={() => onEdit(q)}>{q.description}</span>}
                  </div>
                </td>
                {visibleColumns.subject && <td data-label="Subject"><span className="qt-subject-pill" style={{ background: subj.soft, color: subj.color, borderColor: subj.color }}>{subj.icon} {subj.name}</span></td>}
                {visibleColumns.dueDate && (
                  <td data-label="Due date" className="qt-mono">
                    {q.dueDate ? (
                      <span className={isOverdue ? "qt-overdue-text" : ""}>
                        {q.dueDate}{isOverdue && <span className="qt-overdue-tag"><Icon name="alertCircle" size={11}/> overdue</span>}
